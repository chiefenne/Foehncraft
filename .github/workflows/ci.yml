# Continuous integration (D22): CPU build and tests on GitHub's free hosted
# runners. GPU tests run on the maintainer's machine and are not part of
# these checks.
#
# Three tiers, one workflow (see docs/recipes/development.md, "CI tiers"):
#   PR gate     pull requests: Linux only, `ci` profile (release optimisation,
#               no LTO, 16 codegen units), cases sharded over three jobs.
#               macOS and Windows join when the PR touches platform-sensitive
#               files (build files, I/O, restart, run control, the CLI).
#               Target: about 5 minutes with a warm cache.
#   main        push to main: only what the PR gate did not run: macOS and
#               Windows tests and quick cases, MPI on macOS, the long Linux
#               cases and the debug-build tests. A newer merge cancels the
#               older run (squash merges: the newer commit contains it).
#   full        the nightly schedule, workflow_dispatch and pull requests
#               with the label `full-ci`: the shipped `release` profile,
#               every job on every platform, the long cases, and (nightly,
#               manual) the tests marked slow.
# Why: GitHub Free runs 20 jobs and only 5 macOS jobs at once per account;
# full runs after every merge kept PRs queueing for macOS runners.
# The bitwise-reproducibility tests (thread counts, AMG, G1 backends) are in
# every tier.
#
# Branch protection needs only one required check: "CI OK" (last job).
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # nightly on main: 01:07 UTC = 02:07 in Vienna in winter (03:07 in
    # summer); GitHub cron is UTC only, and minute 7 avoids the top-of-hour
    # queue of scheduled runs
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per PR and one run for pushes to main: a new push cancels the
# older run of its group. Nightly and manual runs get a group of their own:
# with a shared group GitHub keeps only one *pending* run and cancels the
# older pending ones, which is how the first nightly run was cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && 'ci-main' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# bash everywhere, also on Windows (Git Bash), so that "$BUILD_PROFILE" means
# the same in every step
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # HDF5 file locks are flaky on the macOS runners ("unable to lock file",
  # errno 35, in stop_file_ends_the_run); every test writes its own files
  HDF5_USE_FILE_LOCKING: "FALSE"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------
  # Decides what this run does: skip code jobs for docs-only changes, pick
  # the tier, the build profile and the case shards.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}
      tier: ${{ steps.tier.outputs.tier }}
      full: ${{ steps.tier.outputs.full }}
      profile: ${{ steps.tier.outputs.profile }}
      gate: ${{ steps.tier.outputs.gate }}
      debug: ${{ steps.tier.outputs.debug }}
      warm: ${{ steps.tier.outputs.warm }}
      test_os: ${{ steps.tier.outputs.test_os }}
      mpi_os: ${{ steps.tier.outputs.mpi_os }}
      cases: ${{ steps.tier.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      # also on docs-only changes: the number tables can be generated (no
      # number used twice, every topic page listed) and the changelog
      # fragments are well named, and the verification status page matches
      # its feature table (D199)
      - name: Docs indexes, image sizes, changelog fragments, verification status
        run: |
          python3 -m tools.docs.indexes
          python3 -m tools.release.verification_status --check
          python3 -m tools.docs.images --check
          python3 -m tools.release.changelog --print > /dev/null
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          # "code" is everything that can change a build or a result; a PR or
          # a merge that only touches docs/, *.md, assets/ or LICENSE skips
          # the code jobs (CI OK still reports, so the PR can be merged). On
          # a push the change is measured against the previous main commit.
          #
          # "platform": files where macOS and Windows behave differently
          # (build files, toolchain, file I/O, restart, run control, the CLI
          # and its process handling). A PR touching them also runs the
          # macOS and Windows jobs. One brace pattern per filter, because
          # with "every" a file has to match every pattern of a filter.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!assets/**'
              - '!LICENSE'
            platform:
              - '{Cargo.toml,Cargo.lock,**/Cargo.toml,**/Cargo.lock,**/build.rs,rust-toolchain*,.github/**,tools/check/ci_cases.py,crates/foehncraft-parallel/**,crates/foehncraft-cli/**,crates/foehncraft-bench/src/sysinfo.rs,crates/foehncraft-mesh/src/vtkhdf.rs,crates/foehncraft-flow/src/restart.rs,crates/foehncraft-flow/src/control.rs,crates/foehncraft-flow/src/console.rs,crates/foehncraft-flow/src/checkpoint.rs}'
            deps:
              - '{Cargo.lock,**/Cargo.lock,rust-toolchain*}'
      - id: tier
        env:
          EVENT: ${{ github.event_name }}
          LABEL_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PLATFORM: ${{ steps.filter.outputs.platform || 'false' }}
          DEPS: ${{ steps.filter.outputs.deps || 'false' }}
        run: |
          linux='{"os":"ubuntu-latest","set":"linux-1"},{"os":"ubuntu-latest","set":"linux-2"},{"os":"ubuntu-latest","set":"linux-3"}'
          long='{"os":"ubuntu-latest","set":"long"}'
          quick='{"os":"macos-latest","set":"quick"},{"os":"windows-latest","set":"quick"}'
          if [ "$EVENT" = "pull_request" ] && [ "$LABEL_FULL" != "true" ]; then
            tier=pr; profile=ci; gate=true; debug=false; warm=false
            if [ "$PLATFORM" = "true" ]; then
              test_os='["ubuntu-latest","macos-latest","windows-latest"]'
              mpi_os='["ubuntu-latest","macos-latest"]'
              cases="[$linux,$quick]"
            else
              test_os='["ubuntu-latest"]'
              mpi_os='["ubuntu-latest"]'
              cases="[$linux]"
            fi
          elif [ "$EVENT" = "push" ]; then
            # the PR gate already ran Linux; main adds the other platforms,
            # the long cases and the debug build, and warms the PR cache
            # when the dependencies changed
            tier=main; profile=ci; gate=false; debug=true; warm=$DEPS
            test_os='["ubuntu-latest","macos-latest","windows-latest"]'
            mpi_os='["macos-latest"]'
            cases="[$long,$quick]"
          else
            tier=full; profile=release; gate=true; debug=true; warm=true
            test_os='["ubuntu-latest","macos-latest","windows-latest"]'
            mpi_os='["ubuntu-latest","macos-latest"]'
            cases="[$linux,$long,$quick]"
          fi
          full=false; [ "$tier" = "full" ] && full=true
          {
            echo "tier=$tier"; echo "full=$full"; echo "profile=$profile"
            echo "gate=$gate"; echo "debug=$debug"; echo "warm=$warm"
            echo "test_os=$test_os"; echo "mpi_os=$mpi_os"; echo "cases=$cases"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  lint:
    name: Format, clippy, docs
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache but never write their own: the 10 GB
          # repository cache stays warm instead of evicting main's entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lock file of the Python crate is current
        run: |
          cargo metadata --locked --format-version 1 --manifest-path crates/foehncraft-py/Cargo.toml > /dev/null || {
            echo "::error::crates/foehncraft-py/Cargo.lock is out of date: run cargo update -w --manifest-path crates/foehncraft-py/Cargo.toml"; exit 1; }
      - run: cargo fmt --all --check
      - name: Every flow case is in a CI case set
        run: python3 -m tools.check.ci_cases --check
      - run: cargo clippy --workspace --all-targets --locked
      # the CUDA backends compile without a CUDA toolkit (driver and NVRTC
      # are loaded at run time)
      - run: cargo clippy --workspace --all-targets --locked --features foehncraft-cuda/cuda,foehncraft-cli/cuda
      - name: CUDA only in the CUDA backend crate (D60)
        run: python3 -m tools.check.backend
      - name: unsafe only in the named GPU and SIMD modules (D202)
        run: python3 -m tools.check.unsafe_modules
      - name: Crate layering; front ends through the tool registry (D203, D196)
        run: cargo xtask layering
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    name: Minimum Rust version
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --locked

  # ---------------------------------------------------------------------
  # Unit and integration tests, including every bitwise-reproducibility
  # test, and the G1 smoke run (all CPU backends bitwise equal).
  test:
    name: Test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.test_os) }}
    env:
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # build-ci is written by warm-ci-cache on main, build-release here
          shared-key: build-${{ needs.plan.outputs.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.profile == 'release' }}
      # debug build: debug assertions and overflow checks (full tier on
      # every platform, main on Linux; the PR gate relies on the optimised
      # run below)
      - if: needs.plan.outputs.full == 'true' || (needs.plan.outputs.debug == 'true' && runner.os == 'Linux')
        run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --profile "$BUILD_PROFILE"
      - name: Slow tests (marked #[ignore]; nightly and manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo test --workspace --locked --profile "$BUILD_PROFILE" -- --ignored
      - name: G1 smoke run (CPU backends, results bitwise equal)
        run: cargo run --locked --profile "$BUILD_PROFILE" -p foehncraft-cli -- bench g1 examples/cases/bench/g1_ci_small.toml
      - name: Without HDF5 and METIS
        if: runner.os == 'Linux' && needs.plan.outputs.tier != 'main'
        run: |
          cargo test -p foehncraft-mesh --no-default-features --locked
          cargo test -p foehncraft-fv --no-default-features --locked
          cargo test -p foehncraft-flow --no-default-features --locked
          python3 -m tools.check.c_free
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ci-small-${{ matrix.os }}
          path: output/g1_ci_small/

  # ---------------------------------------------------------------------
  # The case catalogue (R5; each case checks its own results), sharded.
  # The lists live in tools/check/ci_cases.py so that CI and recipe 5 run the
  # same cases.
  cases:
    name: Cases ${{ matrix.set }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    env:
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # the dependencies of the test job's cache (same profile, same OS)
          shared-key: build-${{ needs.plan.outputs.profile }}
          save-if: false
      - run: cargo build --locked --profile "$BUILD_PROFILE" -p foehncraft-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # pip installs (and so a pip cache) only on Linux, for the VTK check
          cache: ${{ runner.os == 'Linux' && 'pip' || '' }}
          cache-dependency-path: tools/requirements-ci.txt
      - name: Run the cases of set ${{ matrix.set }}
        shell: bash
        run: python -m tools.check.ci_cases "${{ matrix.set }}" "target/$BUILD_PROFILE/foehn"
      - name: VTKHDF files load with VTK's reader (the reader of ParaView)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pip install -r tools/requirements-ci.txt
          shopt -s nullglob
          files=(output/*/mesh.vtkhdf output/*/fields.vtkhdf output/*/*/fields.vtkhdf)
          if [ ${#files[@]} -gt 0 ]; then python3 -m tools.check.vtkhdf "${files[@]}"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-reports-${{ matrix.set }}-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            output/*/mesh_report.md
            output/*/scalar.md
            output/*/poisson.md
            output/*/flow.md
            output/*/*.svg
            output/*/*/*.svg
            output/*/convergence.svg

  # ---------------------------------------------------------------------
  hypre:
    name: Pressure solver against hypre (D20)
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    env:
      HYPRE_DIR: ${{ github.workspace }}/hypre-install
      # always the ci profile: hypre is a reference comparison, not the
      # shipped build, and so main writes the cache that pull requests read
      BUILD_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the hypre build
        id: hypre-cache
        uses: actions/cache@v4
        with:
          path: hypre-install
          key: hypre-v3.2.1-${{ runner.os }}-${{ hashFiles('tools/bench/build_hypre.py') }}
      - name: Build hypre (sequential, shared)
        if: steps.hypre-cache.outputs.cache-hit != 'true'
        run: python3 -m tools.bench.build_hypre "$HYPRE_DIR"
      - run: cargo clippy -p foehncraft-fv -p foehncraft-cli --all-targets --locked --features foehncraft-fv/hypre,foehncraft-cli/hypre
      - name: Stage-3 tests including the agreement with hypre
        run: cargo test --locked --profile "$BUILD_PROFILE" -p foehncraft-fv --features hypre --test stage3
      - name: Poisson studies with hypre as the reference
        shell: bash
        run: |
          cargo build --locked --profile "$BUILD_PROFILE" -p foehncraft-cli --features hypre
          for f in examples/cases/poisson/*_box.toml; do
            n=$(basename "$f" .toml)
            "target/$BUILD_PROFILE/foehn" poisson "$f" --solvers amg,amg-double,jacobi,hypre \
              --backends cpu,cpu-serial --out "output/${n}_hypre"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: poisson-hypre-reports
          path: |
            output/*_hypre/poisson.md
            output/*_hypre/iterations.svg

  # ---------------------------------------------------------------------
  mpi:
    name: MPI, 4 ranks on one machine (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.mpi_os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Open MPI (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev
      - name: Install Open MPI (macOS)
        if: runner.os == 'macOS'
        run: brew install open-mpi
      - run: cargo test -p foehncraft-parallel --features mpi --locked
      - run: cargo build --release -p foehncraft-parallel --features mpi --example mpi_smoke --locked
      - name: Run with 4 ranks
        run: mpirun --oversubscribe -n 4 target/release/examples/mpi_smoke
      - name: Run with 2 ranks
        run: mpirun --oversubscribe -n 2 target/release/examples/mpi_smoke
      - run: cargo build --release -p foehncraft-mesh --features mpi --example mpi_halo --locked
      - name: Halo exchange of a partitioned mesh, 4 and 2 ranks
        run: |
          mpirun --oversubscribe -n 4 target/release/examples/mpi_halo
          mpirun --oversubscribe -n 2 target/release/examples/mpi_halo
      - run: cargo build --release -p foehncraft-mesh --features mpi --example mpi_matrix --locked
      - name: Geometry and diffusion-matrix rows bitwise equal to one rank (spike, 1 to 4 ranks)
        run: |
          for n in 1 2 3 4; do
            mpirun --oversubscribe -n $n target/release/examples/mpi_matrix
            SPIKE_KIND=hex mpirun --oversubscribe -n $n target/release/examples/mpi_matrix
          done

  ptx:
    name: Single-source GPU kernels compile to PTX (G1, stages 2, 3 and 5)
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads gpu/ptx-kernels/rust-toolchain.toml and installs nightly
      # with the nvptx64-nvidia-cuda target
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpu/ptx-kernels -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 gpu/ptx-kernels/build.py
      - name: No atomics, no f32, no contracted f64 arithmetic in the kernels (R10)
        run: python3 -m tools.check.kernels
      - run: python3 gpu/ptx-kernels/build.py sm_86
      - uses: actions/upload-artifact@v4
        with:
          name: g1-ptx
          path: target/nvptx64-nvidia-cuda/release/foehncraft_ptx_kernels.ptx

  # ---------------------------------------------------------------------
  # Nothing else writes the `ci`-profile cache that pull requests read. This
  # job compiles the dependencies in the `ci` profile on every OS and saves
  # them; pull requests then compile only the workspace crates. Nightly and
  # manual runs, and pushes to main that change Cargo.lock or the toolchain
  # (the cache key changes with them); no tests.
  warm-ci-cache:
    name: Warm the PR build cache (${{ matrix.os }})
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.code == 'true' && needs.plan.outputs.warm == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-ci
      - run: cargo test --workspace --locked --profile ci --no-run
      - run: cargo build --locked --profile ci -p foehncraft-cli

  # ---------------------------------------------------------------------
  # The Python package (D61): the native module built with maturin, the
  # tests against it and against the command line, ruff.
  python:
    name: Python package (ruff, pytest)
    needs: plan
    if: needs.plan.outputs.code == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    env:
      # one target directory for the command line and the native module
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: python
          workspaces: |
            . -> target
            crates/foehncraft-py -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: |
          pip install "ruff>=0.5"
          ruff check python
          ruff format --check python
          # the scripts of tools/, gpu/ and examples/ (D61): syntax and names
          ruff check --isolated --select E9,F tools gpu examples
          python -m tools.check.ci_cases --check
      - name: Format and clippy of the native module
        run: |
          cargo fmt --manifest-path crates/foehncraft-py/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/foehncraft-py/Cargo.toml --all-targets
      - run: cargo build --locked --profile ci -p foehncraft-cli
      - name: Build and install the package (maturin)
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2" numpy h5py scipy pytest
          cd python && maturin develop --release --locked
      - name: Tests (pytest, in process and through the command line)
        run: |
          . .venv/bin/activate
          FOEHN="$PWD/target/ci/foehn" python -m pytest python/tests -q

  # ---------------------------------------------------------------------
  # The single required check. Green when every job above passed or was
  # skipped on purpose (docs-only PR); red when any failed or was cancelled.
  ci-ok:
    name: CI OK
    if: always()
    needs: [plan, lint, msrv, test, cases, hypre, mpi, ptx, python, warm-ci-cache]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1;; esac
          done
