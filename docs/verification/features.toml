  { kind = "exact", case = "couette_poly", what = "exact on polyhedra" },
  { kind = "exact", case = "couette_tet", what = "exact on tetrahedra" },
  { kind = "exact", case = "couette_mixed", what = "exact on mixed cells" },
  { kind = "exact", case = "poiseuille_tet", what = "second order on tetrahedra" },
  { kind = "exact", case = "poiseuille_mixed", what = "second order on mixed cells" },
  { kind = "reference-data", case = "cavity_re100", what = "lid-driven cavity against Ghia et al. (1982)", doc = "docs/verification/stage4.md#lid-driven-cavity" },
  { kind = "reference-data", case = "cavity_re1000", what = "the cavity at Re 1000 against Ghia et al." },
  { kind = "reference-data", case = "cavity_re100_tet3d", what = "the cavity on 3D tetrahedra" },
  { kind = "reference-data", case = "cavity_re100_poly3d", what = "the cavity on 3D polyhedra" },
  { kind = "reference-data", case = "cavity_re1000_poly3d", what = "the cavity at Re 1000 on 3D polyhedra" },
  { kind = "reference-data", case = "cylinder_re20", what = "the cylinder of Schäfer & Turek (1996), 2D-1" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/stage4.rs::converged_result_does_not_depend_on_relaxation", what = "the converged result does not depend on the relaxation" },
]
notes = ["SIMPLE (without C) shares the code path and is not checked by a case of its own"]

[[feature]]
id = "coupling.coupled"
area = "Pressure–velocity coupling"
title = "Coupled pressure–velocity algorithm with pseudo-time steps"
switch = 'solver.algorithm = "coupled"'
decisions = ["D178"]
evidence = [
  { kind = "consistency", test = "crates/foehncraft-flow/tests/coupled.rs::coupled_result_is_the_simplec_result", what = "the converged SIMPLEC result" },
  { kind = "reference-data", case = "cavity_re1000_coupled", what = "the cavity at Re 1000 against Ghia et al." },
  { kind = "reference-data", case = "cylinder_re20_gci", what = "the cylinder at Re 20 on three meshes, with the GCI" },
  { kind = "reference-data", case = "backstep_zeta_f0_coupled", what = "the step: x_r/H 6.44, the SIMPLEC value", doc = "docs/verification/stage6.md#backward-facing-step-against-the-experiment-part-6g-95" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/coupled.rs::coupled_results_are_bitwise_equal_on_1_and_4_threads", what = "bitwise equal on 1 and 4 threads" },
]
gaps = [
  "no exact solution run with the coupled algorithm itself (it is checked by giving the SIMPLEC result)",
  "SST on 1 536 cells and the elliptic-blending k-ε on 768 and 1 536 cells of the channel stop near 10⁻⁷ within 3 000 iterations (stage 6, channel study)",
]

[[feature]]
id = "coupling.piso"
area = "Pressure–velocity coupling"
title = "PISO with outer correctors, transient"
switch = "[time]"
evidence = [
  { kind = "exact", case = "taylor_green_space", what = "second order in space", doc = "docs/verification/stage5.md#taylorgreen-vortex" },
  { kind = "exact", case = "taylor_green_cfl10", what = "second order in time at Courant number 9 with outer correctors" },
  { kind = "exact", case = "channel_ramp", what = "channel start-up against the exact solution" },
  { kind = "reference-data", case = "cylinder_re100", what = "the vortex street of Schäfer & Turek (1996), 2D-2", doc = "docs/verification/stage5.md#cylinder-in-a-channel-schäfer--turek-1996" },
  { kind = "reference-data", case = "cylinder_re100_short", what = "the same in a short channel" },
  { kind = "consistency", case = "cavity_re100_transient", what = "time stepping to the steady state gives the Ghia cavity" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/transient.rs::steady_state_of_the_time_stepping_is_the_simplec_solution", what = "the steady state of the time stepping is the SIMPLEC solution" },
]

[[feature]]
id = "coupling.wedge-corrector"
area = "Pressure–velocity coupling"
title = "SIMPLEC-type correctors on thin wedge cells at an axis"
switch = "solver.corrector"
evidence = [
  { kind = "exact", case = "pot_solid_body_viscous", what = "solid-body rotation at high viscosity through the axis wedges", doc = "docs/verification/stage6.md#the-piso-corrector-on-thin-wedge-cells-at-an-axis-pr-106" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/sliding.rs::solid_body_rotation_is_kept_at_high_viscosity_on_the_axis_wedges", what = "solid-body rotation kept" },
]

