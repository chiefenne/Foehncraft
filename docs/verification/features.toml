# The feature table of the verification status page (D199).
#
# One row per feature a user can switch on, written by hand and reviewed in
# pull requests. The grade (verified, partial, unverified) is computed by
# `python3 -m tools.release.verification_status` from this table and the
# last verification manual (results.json); it is never written here.
# The generated page is docs/verification/status.md; CI fails when it is
# out of date, when a case, test or page named here does not exist, or when
# a catalogue case checks no feature.
#
# Keys of a row:
#   id         area.name, stable (the limitations of a run name it)
#   area       section of the status page
#   title      what the user sees
#   switch     the case key that turns it on (optional)
#   decisions  decisions of docs/requirements.md (optional)
#   model      true for a physical model: verified needs reference data too
#   evidence   items with `kind` (exact | manufactured | reference-data |
#              consistency), `what` (the check and its result), and one or
#              more of `case` (catalogue case name), `test`
#              (path::function), `run` (a recorded run outside CI, with the
#              `doc` that records it); `doc` points to the results
#   gaps       missing checks and bands that are not met; each one lowers
#              the grade to partial at most
#   notes      findings that do not lower the grade (model-form behaviour
#              against a reference whose spread is known)
#   range      validated range, read by the run check of D199 (LIM002):
#              y_plus_first, reynolds, prandtl, courant, skewness, mach

# ---------------------------------------------------------------- meshes

[[feature]]
id = "mesh.generated"
area = "Meshes"
title = "Built-in test mesher (hexahedra, tetrahedra, prisms, polyhedra)"
switch = "[mesh.generate] type"
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/generated.rs::generated_meshes_are_closed_and_fill_the_box", what = "every cell type closed, the volumes fill the box" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/golden.rs::golden_values_of_mesher_and_partitioner", what = "golden values of the mesher and the partitioner" },
  { kind = "exact", case = "poiseuille_poly", what = "second order of the flow solver on generated polyhedra", doc = "docs/verification/stage4.md#couette-and-poiseuille-flow" },
  { kind = "exact", case = "mms_mixed_box", what = "second order of convection-diffusion on mixed cells", doc = "docs/verification/stage2.md#order-of-accuracy" },
]

[[feature]]
id = "mesh.gmsh"
area = "Meshes"
title = "Gmsh v4 reader"
switch = 'mesh.format = "gmsh"'
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/gmsh.rs::box_tet_ascii_and_binary_are_equal", what = "ASCII and binary files give the same mesh" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/gmsh_fingerprint.rs::gmsh_meshes_are_unchanged", what = "fingerprints of the Gmsh meshes of the catalogue" },
  { kind = "reference-data", case = "pipe_gmsh_raw", what = "developing laminar pipe flow on raw Gmsh tetrahedra converges (with the automatic remediation)" },
  { kind = "reference-data", case = "tjunction_mixing", what = "3D T-junction on polyhedra converted from Gmsh tetrahedra, three meshes: inlet pressure order 1.77, GCI 2.4 %" },
]
gaps = [
  "T-junction (gallery 196): the pressure at the branch inlet is not grid-convergent (observed order 0.2, GCI 29 %); the scalar difference downstream converges with the MLP limiter (order 2.1, GCI 11 %); no comparison with published measurements yet",
  "conversion into polyhedra fails with GEN001 (a boundary cell centre behind its face) on Netgen-optimised tetrahedra and on one fine Gmsh mesh of the T-junction (h = 0.005 m); sizes that convert are used",
]

[[feature]]
id = "mesh.su2"
area = "Meshes"
title = "SU2 reader (2D extruded, multi-zone)"
switch = 'mesh.format = "su2"'
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/su2.rs::mixed_3d_cells_and_markers", what = "mixed 3D cells and markers" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/multizone.rs::su2_zones_kept_apart_non_matching", what = "zones kept apart for a sliding interface" },
  { kind = "reference-data", case = "naca0012_su2_re1000", what = "laminar NACA 0012 at Re 1000 converges on the SU2 mesh" },
  { kind = "exact", case = "taylor_couette_su2_zones", what = "Taylor–Couette on an SU2 two-zone mesh against the exact profile" },
]

[[feature]]
id = "mesh.cgns"
area = "Meshes"
title = "CGNS (HDF5) reader"
switch = 'mesh.format = "cgns"'
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/cgns.rs::ngon_nface_equals_openfoam_dual", what = "NGON/NFACE file equals the OpenFOAM-format dual mesh" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/multizone.rs::cgns_zones", what = "zones of a multi-zone file" },
]
gaps = ["no flow case of the catalogue reads a CGNS file"]

[[feature]]
