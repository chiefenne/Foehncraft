  { kind = "exact", test = "crates/foehncraft-kernels/src/particle.rs::eddy_times_follow_gosman_and_ioannides", what = "eddy length, lifetime and interaction time of Gosman and Ioannides (1983), the crossing time and its limit l_e/|w|" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/coupling.rs::sources_do_not_depend_on_parcel_order_or_threads", what = "V28.1 with eddies: sources, closing step and parcel states (with their eddies) bitwise equal with the storage reversed and on one thread, hex, tet and poly; momentum books close to round-off; no parcel lost" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/spray_coupling.rs::dispersion_gives_the_same_bits_on_any_number_of_threads", what = "a two-way run with dispersion: spray.csv bitwise equal on 1 and 4 threads" },
  { kind = "contract", property = "diagnostics", case = "spray_dispersion", what = "droplets of 20 to 300 um shot along the axis of a turbulent duct spread by the eddies alone; small droplets spread faster than large ones; no parcel lost", doc = "docs/gallery/sprays.md#spray-dispersion" },
