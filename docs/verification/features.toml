title = "Curvature and rotation correction of SST (Smirnov & Menter 2009)"
switch = "turbulence.curvature_correction = true"
decisions = ["D170"]
model = true
evidence = [
  { kind = "exact", test = "crates/foehncraft-kernels/src/turb/sst.rs::absolute_and_relative_frames_agree", what = "f_r1 the same in the inertial and the turning frame to 10⁻¹⁴", doc = "docs/verification/stage6.md#curvature-and-rotation-correction-of-sst-6h-d170-pr-113" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/curvature.rs::pure_shear_is_unchanged", what = "a channel without rotation unchanged to the last digit" },
  { kind = "reference-data", case = "channel_rotating_sst", what = "channel in spanwise rotation, Ro 0.15: the unstable side marked" },
  { kind = "manufactured", test = "crates/foehncraft-flow/src/turbulence/mms.rs::curvature_correction_manufactured_solution_orders", what = "orders 1.9 to 2.1 of k and ω with f_r1 (DS_ij/Dt from a flow whose strain axes turn) on hexahedra and polyhedra", doc = "docs/verification/stage6.md#manufactured-solutions-of-k-ε-ζ-f₀-the-curvature-correction-and-the-qcr-pr-184" },
  { kind = "manufactured", test = "crates/foehncraft-flow/src/turbulence/mms.rs::curvature_correction_on_tetrahedra_converges", what = "order 1.9 to 2.1 of k and ω on regular and 15 % perturbed tetrahedra with S_ij from a second-order velocity gradient and the gradient of S_ij from a quadratic least-squares fit where the least-squares one is not consistent (D236)", doc = "docs/verification/stage6.md#consistent-curvature-correction-on-irregular-meshes-d236-pr-197" },
  { kind = "consistency", run = "ubend_sst with turbulence.curvature_correction = true, levels 0 and 1", what = "U-bend Rc/H = 1: the bubble on the convex inner wall grows (separation 127.5 deg instead of 139.4 deg, reattachment 2.57 H instead of 2.19 H on level 1)", doc = "docs/gallery/turbulence.md#ubend" },
]
gaps = [
  "the DNS of Kristoffersen & Andersson (1993) for the rotating channel is not compared (its data are not in the repository)",
  "on one-layer 2D meshes the operator check (D236) reports MESH005 on every cell: the quadratic fit of the velocity Hessian is rank deficient in z (U-bend, gallery 204); a false alarm in 2D, not fixed",
]

[[feature]]
id = "turbulence.qcr"
area = "Turbulence models"
title = "Quadratic constitutive relation QCR2000 and QCR2013"
switch = 'turbulence.qcr = "qcr2000"'
decisions = ["D170"]
model = true
evidence = [
  { kind = "exact", test = "crates/foehncraft-kernels/src/turb/sst.rs::qcr_of_a_shear_flow", what = "the six components in simple shear to 10⁻¹²", doc = "docs/verification/stage6.md#quadratic-constitutive-relation-of-sst-6h-d170-pr-115" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/curvature.rs::qcr_drives_the_secondary_flow_of_a_duct", what = "secondary flow of a square duct appears with QCR, not without" },
  { kind = "reference-data", case = "square_duct_qcr", what = "square duct, Re_b 3 500: secondary velocity 1.55 % of U_b, the vortex pair into the corner" },
  { kind = "manufactured", test = "crates/foehncraft-flow/src/turbulence/mms.rs::qcr_stress_manufactured_solution_orders", what = "the explicit stress force of QCR2000 and QCR2013 against the divergence of the written-out stress: order 2.0 to 2.1 on regular hexahedra and polyhedra", doc = "docs/verification/stage6.md#manufactured-solutions-of-k-ε-ζ-f₀-the-curvature-correction-and-the-qcr-pr-184" },
  { kind = "manufactured", test = "crates/foehncraft-flow/src/turbulence/mms.rs::qcr_stress_on_perturbed_meshes_converges", what = "the stress force on 15 % perturbed hexahedra and tetrahedra converges (hexahedra 4.6 %, 1.5 %, 0.65 %; tetrahedra order 1) with the quadratic least-squares gradient and the skewness-corrected face stress (D236)", doc = "docs/verification/stage6.md#consistent-qcr-stress-on-irregular-meshes-d236-pr-194" },
]
gaps = [
  "the DNS of Pinelli et al. (2010) is not compared within a band (its data are not in the repository)",
  "the divergence of the explicit QCR stress is first order on tetrahedra, regular or perturbed (the midpoint rule of the face sum on irregular cells), and second order only on regular hexahedra and polyhedra; the coupled momentum equations are not in the manufactured solution",
]

