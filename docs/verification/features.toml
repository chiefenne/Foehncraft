  { kind = "reference-data", test = "crates/foehncraft-flow/src/species.rs::the_spray_vapours_meet_the_nist_data", what = "NC7H16, IC8H18 and NC12H26 ideal-gas c_p within 0.6 % of the NIST data; heptane vapour viscosity at 371 K and dodecane vapour viscosity at 500 K within 5 % of NIST" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/evaporation.rs::a_given_surface_fraction_replaces_raoults_law", what = "a surface fraction given to the kernel (the hook of the high-pressure surface) replaces Raoult's law bit for bit; capped at 0.999" },
  { kind = "reference-data", test = "crates/foehncraft-flow/tests/droplet_validation.rs::n_heptane_droplets_against_chauveau_2019", what = "n-heptane droplets of 0.37 mm in N2 at 0.1 MPa, 473 to 748 K, through Spray::evaporation: K with the 1/3 rule +39 to +59 % above the microgravity fit of Chauveau et al. (2019), with far-field properties +93 to +99 %; the 1/3 rule closer at every temperature (a recorded gap, see gaps)", doc = "docs/gallery/sprays.md#spray-liquid-library" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-particles/src/config.rs::a_library_liquid_takes_its_properties_and_checks_its_keys", what = "a library liquid takes its properties, a second application keeps them, water keeps IAPWS-95; an unknown liquid (names listed), a value given beside the library and a property temperature without a library are refused" },
  { kind = "contract", property = "diagnostics", case = "spray_heptane_evaporation", what = "1 g/s of n-heptane at 300 K in N2 at 600 K: evaporates within about 5 cm, the gas takes 1 g/s of vapour and leaves at 312 C with 1.7 % vapour", doc = "docs/gallery/sprays.md#spray-liquid-library" },
  { kind = "contract", property = "schema", case = "spray_heptane_evaporation_injectors", what = "the included injector file with the library liquid n-heptane", doc = "docs/cases/flow.md#lagrangian-sprays" },
]
gaps = [
  "single n-heptane droplets: K with the 1/3 rule +39 to +59 % above the microgravity data and +16 to +38 % above the fibre-free extrapolation of Chauveau et al.; the same gap is reported for this model class (Both, Mira, Lehmkuhl 2022) and the microgravity data lie below quasi-steady theory (vapour accumulation); not closed",
  "no spray-scale evaporation case against measurements yet (CORIA n-heptane data on request; the Brno PDA data are a dispersion case)",
  "density and specific heat of the liquid constant in a run (at property_temperature): no thermal expansion of a heating droplet",
  "iso-octane above about 400 K rests on extrapolated correlations (density, c_l, mu, sigma); not in the NIST fluid system",
  "the film carrier is the start composition of the case, not the local gas of the cell",
]

[[feature]]
id = "sprays.breakup"
area = "Sprays"
title = "Spray breakup: KH-ACT and KH-RT with blob injection, TAB distortion and dynamic drag (SP6, D300 to D309)"
switch = "[spray.breakup] model = \"kh-act\" or \"kh-rt\", drag = \"dynamic\"; injector hole_diameter, area_contraction, rate, flow_share, hole_length, discharge_coefficient"
decisions = ["D247", "D300", "D301", "D302", "D303", "D304", "D305", "D306", "D307", "D308", "D309"]
model = true
evidence = [
  { kind = "exact", test = "crates/foehncraft-kernels/src/breakup.rs::kh_fits_match_the_dispersion_relation", what = "Reitz's KH fits against our own inviscid dispersion relation of a liquid column (Bessel functions): wavelength within 5 % for every We_g, growth rate within 3 % below We_g 0.1 and above 50 (up to 46 % high near We_g 2, a property of the fit)" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/breakup.rs::tab_step_is_exact", what = "the TAB oscillator step against fourth-order Runge-Kutta, under-, over- and critically damped" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/breakup.rs::nozzle_turbulence_decays_as_the_k_eps_equations", what = "KH-ACT: the exact decay of the nozzle turbulence against RK4 of the k-eps equations without production (k, eps, L_T, tau_T to 1e-9), the integral of sqrt(k) against Simpson's rule, L_T/tau_T = sqrt(k)" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/breakup.rs::act_strip_picks_the_strongest", what = "KH-ACT: the mechanism with the largest L/tau strips the blob, the radius stops at the child radius, C_T,CAV scales the rate" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/breakup.rs::a_blob_strips_as_the_breakup_equation", what = "the KH radius of a blob follows da/dt = -(a - B0 Lambda)/tau integrated independently by RK4, within 2 % of the stripped part over more than half of its life" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/breakup.rs::kh_act_turbulence_strips_at_the_root_of_k", what = "KH-ACT: a blob stripped by the nozzle turbulence alone has the radius a0 - C_T,CAV int sqrt(k) dt to 1e-12 of a0 whatever the sub-steps" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/breakup.rs::same_bits_on_any_threads_and_order", what = "D247 with breakup: children, RT breakups and dynamic drag bitwise equal on 1 and 4 threads with the storage reversed" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/breakup.rs::kh_act_keeps_the_liquid_and_the_bits", what = "KH-ACT with the Huh-Gosman turbulence and cavities: liquid kept to 1e-13, bitwise equal on 1 and 4 threads with the storage reversed" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/breakup.rs::blobs_shed_children_and_keep_the_liquid", what = "blobs shed children of the KH size, each of one to three shares; liquid in the flow plus out = injected to 1e-13" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/breakup.rs::rayleigh_taylor_acts_beyond_the_breakup_length_only", what = "RT breakup only beyond the breakup length" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/breakup.rs::a_rate_table_gives_exact_shares_and_speeds", what = "a rate table gives each parcel its exact share of the liquid and the speed mdot/(rho_l C_a A)" },
  { kind = "contract", property = "bitwise", test = "crates/foehncraft-particles/tests/breakup.rs::a_restart_continues_with_the_same_bits", what = "a restart with breakup continues with the same bits" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-particles/tests/breakup.rs::kh_act_needs_the_nozzle_turbulence", what = "the nozzle keys of KH-ACT are checked (missing turbulence, half a pair, C_d above C_a, no friction left)" },
  { kind = "reference-data", case = "spray_breakup", what = "a diesel-like spray at 60 MPa from a 0.15 mm hole into nitrogen at 15 kg/m3 (KH-ACT, k-eps): 97 % of the liquid at 50.6 mm after 1 ms against 51.1 mm of the correlation of Hiroyasu and Arai (1990), up to 24 % ahead at 0.2 to 0.4 ms; 47.0 mm with kh-rt", doc = "docs/gallery/sprays.md#spray-breakup" },
  { kind = "contract", property = "schema", case = "spray_breakup_injectors", what = "the included injector file of spray_breakup (rate table, hole, nozzle turbulence)", doc = "docs/cases/flow.md#lagrangian-sprays" },
  { kind = "reference-data", case = "spray_g_g1", what = "ECN Spray G, G1 (D309): iso-octane at 20 MPa into nitrogen at 573 K and 3.5 kg/m3 on a 22.5 deg sector of the 8-hole injector, KH-ACT untuned, against the liquid (0.2e-3 mm3/mm2) and vapour (0.1 %) penetration the ECN measured: within 1 mm up to 0.4 ms (20.5 against 20.4 mm at 0.3 ms), then ahead, 12 % at 0.6 ms and 33 % at 1.2 ms (51.7 against 38.9 mm); vapour 32.8 against 29.4 mm at 0.6 ms and 50.8 against 42.0 mm at 1.2 ms; the gas velocity on the injector axis at 15 mm within about 1.5 m/s of the PIV (-7.9 against -7.6 m/s at 0.3 ms); Sauter mean diameter at 15 mm 17 um with KH-ACT and 7.4 um with KH-RT against the measured 9 um, both models with the same penetration", doc = "docs/gallery/sprays.md#spray-g" },
  { kind = "contract", property = "schema", case = "spray_g_g1_injectors", what = "the included injector file of spray_g_g1 (library iso-octane, measured rate of injection, plume direction, flow_share 0.5)", doc = "docs/cases/flow.md#lagrangian-sprays" },
]
gaps = [
  "ECN Spray G (G1): the liquid runs ahead of the measured penetration after 0.4 ms (33 % at 1.2 ms) and the vapour after 0.5 ms (21 % at 1.2 ms), with KH-ACT and KH-RT alike, so not from the breakup; cause open (candidates: the cells of the far field, the constant gas density, the k-eps constants) (D309)",
  "KH-ACT drops on ECN Spray G (G1) are about twice the measured size at 15 mm (17 against 9 um; KH-RT 7.4 um): the children of the cavitation (R_CAV from C_a 0.65) and of the integral turbulence scale are large for the short Spray G hole; constants untuned",
  "a gas that diverges in some cells leaves its parcels spending max_substeps each, and their exchange records can fill the memory instead of stopping the run with a message (seen on the sector before the slip core, D309)",
  "drop sizes not validated: the gallery spray has a Sauter mean diameter near 2 um, small next to measured diesel sprays; no collision or coalescence yet",
  "the nozzle turbulence of the Huh-Gosman estimate takes the inlet loss K_c = 0.5 and the area ratio s = 0 as our own choices (the papers give no values)",
  "the k-omega SST model does not build up the turbulence of a thin spray jet in a still chamber (the gallery case uses k-eps)",
  "breakup is refused in the steady spray mode; constant surface tension and viscosity; children leave with the blob's velocity (no radial velocity); no GPU entry of the breakup kernel; one process",
]

[[feature]]
id = "sprays.high-pressure-surface"
area = "Sprays"
title = "High-pressure droplet surface: Peng-Robinson phase equilibrium and latent heat (Spray A, SA1, D311, D312, D314)"
switch = "[spray.evaporation] equilibrium = \"peng-robinson\", [spray.evaporation.peng_robinson]"
decisions = ["D310", "D311", "D312", "D314", "D319"]
model = true
evidence = [
  { kind = "exact", test = "crates/foehncraft-kernels/src/realfluid.rs::the_omegas_are_the_roots_of_the_critical_conditions", what = "Omega_a, Omega_b and Z_c give the triple root of the cubic at the critical point (to 1e-15)" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/high_pressure.rs::va1_the_peng_robinson_vapour_pressure_follows_the_measured_equation", what = "VA.1: n-dodecane vapour pressure with the fitted Mathias-Copeman alpha within 1 % of the Wagner equation of Ambrose and Walton (1989) from 300 to 655 K (the plain 1978 kappa is 16 % off at 300 K)" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/high_pressure.rs::va2_bubble_pressures_of_nitrogen_in_dodecane", what = "VA.2: 21 measured bubble points of N2 + n-dodecane (Garcia-Cordova et al. 2011, 344 to 594 K, 1.4 to 13 MPa): mean deviation below 4 %, at most 10 %; k_ij = 0.205 fitted by us to the 75 points up to 20 MPa (mean 2.7 %, at most 9.1 %)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_wagner_equation_gives_the_normal_boiling_point", what = "the transcribed Ambrose and Walton coefficients give 101.325 kPa at the normal boiling point 489.439 K of Lemmon and Goodwin (2000) within 0.2 %" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/high_pressure.rs::fit_mathias_copeman_reproduces_the_dodecane_coefficients", what = "the built-in alpha coefficients are reproduced by the fit routine to 2e-3" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/high_pressure.rs::va3_low_pressure_limit_is_raoult", what = "VA.3: the surface vapour fraction tends to Raoult's law as p -> 0 (0.3 % above at 10 kPa, below 3 % at 0.1 MPa, growing with p)" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_surface_at_six_megapascal_is_richer_than_raoult_and_ends_critical", what = "at 6 MPa: 1.5 to 1.9 times Raoult from 450 to 600 K, 8 to 20 mol % N2 dissolved, latent heat ratio 0.8 to 0.92 falling monotonically to zero at the critical mixing temperature 651.3 K" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_critical_mixing_temperature_falls_with_pressure", what = "the critical end follows the critical locus of the binary: 656.6 K at 3 MPa down to 647.8 K at 8 MPa" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/high_pressure.rs::below_the_critical_pressure_the_table_ends_boiling", what = "at 1 MPa the table ends at the boiling point, within 5 K of the pure fuel's" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_table_is_a_pure_function_of_its_inputs", what = "two builds give the same bits (D247)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/evaporation.rs::a_closed_box_with_the_peng_robinson_surface_closes_its_books", what = "VA.6: the closed box of V28.2 with the Peng-Robinson surface of water in nitrogen, 3000 steps: water and energy of gas plus parcels kept to 1e-12; gas within 0.01 K of the adiabatic saturation of the spray's own surface fraction and latent heat (found 0.007 K)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_spray_takes_the_surface_of_the_table_and_closes_its_books", what = "the spray takes y_f p0 and L_lib L_PR/L_PR,sat of the table bit for bit; the gas receives c_l T + L (books close by construction); a droplet evaporates" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-particles/tests/high_pressure.rs::parcels_above_the_critical_mixing_temperature_are_counted", what = "D314: parcels above the critical mixing temperature are counted with their mass and get no latent heat" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_keys_are_checked", what = "unknown fuel, partial critical constants, unknown gas and a k_ij of a gas not in the ambient are refused with the key named" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/realfluid.rs::rachford_rice_finds_the_vapour_fraction_of_a_known_split", what = "Rachford-Rice gives beta = 1/2 for K = (2, 1/2), z = (1/2, 1/2) to 1e-15 and no split when all K exceed 1" },
  { kind = "consistency", test = "crates/foehncraft-kernels/src/realfluid.rs::a_binary_flash_gives_the_phases_of_the_surface_equilibrium", what = "the flash of N2 + n-dodecane at 500 K, 6 MPa gives the same coexisting phases for three feeds, equal to the droplet surface solution (1e-9), mass balance to 1e-12; a feed outside the two-phase range stays one phase" },
  { kind = "consistency", test = "crates/foehncraft-kernels/src/realfluid.rs::the_stability_test_tells_one_phase_from_two", what = "Michelsen's tangent-plane test: pure components and hot gas with a little fuel stable, an equimolar mixture at 450 K, 6 MPa unstable" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/mixing_line.rs::the_ideal_gas_of_dodecane_follows_its_heat_capacity_table", what = "n-dodecane ideal gas: Scott (1974) c_p by the CH2 increment, NASA-7 fit within 0.3 % (within 0.24 % of Lemmon and Huber 2004 at 300 to 700 K), enthalpy of formation -290.9 kJ/mol" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/species.rs::the_dodecane_vapour_is_the_kernel_ideal_gas", what = "the vapour species NC12H26 of the flow's species data is the kernel's n-dodecane ideal gas (same coefficients, range and Lennard-Jones data); its c_p within 0.6 % of Lemmon and Huber (2004) at 500 and 700 K, its kinetic-theory viscosity within 5 % at 500 K (the_spray_vapours_meet_the_nist_data)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/mixing_line.rs::va4_the_mixing_line_closes_the_energy_balance", what = "VA.4: 363 K n-dodecane into 900 K N2 at 6 MPa, frozen, equilibrium and ideal: the enthalpy of the state found equals that of the mixed streams to 1e-13 of the stream difference (found 7e-16), the end points are the streams" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/mixing_line.rs::va4_the_two_phase_region_of_the_mixing_line", what = "VA.4: Z_sat 0.357 (equilibrium) against 0.320 (ideal); the frozen line equals the equilibrium line before Z_sat and fails the stability test where the flash splits (1e-6); equal fugacities and dissolved N2 in the two-phase region" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/mixing_line.rs::va5_the_siebers_liquid_length_with_our_thermodynamics", what = "VA.5: Siebers (1999) liquid length with our Z_sat at the four measured Spray A conditions (ECN DBI, 210675): 7.2/11.3/4.9/10.7 mm (equilibrium) and 8.2/13.0/5.7/11.3 mm (ideal) against 11.7/16.3/7.4/20.6 mm; the trends with temperature and density right" },
]
gaps = [
  "VA.5 not met: Siebers' scaling (C_L = 0.62, measured 21.5 deg angle) with our saturation mixture fraction is 30 to 48 % below the measured liquid lengths (equilibrium) and 20 to 45 % (ideal); the real fluid shortens it by 5 to 14 %, away from the measurement; Siebers' own B is not in an open paper",
  "above 550 K Peng-Robinson with one k_ij is 3 to 9 % low on the measured bubble pressures (the measured Henry constant falls faster with T); the surface vapour fraction moves by 2 to 6 % between the k_ij of the whole set and of the hot isotherms",
  "the dissolved gas shifts the equilibrium but is not booked: the liquid stays pure fuel (D311)",
  "the gas solver stays ideal (D317): the departure enthalpy of the dense vapour enters the gas as a sensible-heat deficit",
  "no flow case yet: VA.7 to VA.9 (order independence with a fuel vapour, the Spray A case) are later stages; the vapour species NC12H26 is in the species data",
  "built-in high-pressure data for n-dodecane only; other liquids take the plain 1978 kappa (water: 11 % low on its vapour pressure at 320 K)",
]

[[feature]]
id = "sprays.high-pressure-film"
area = "Sprays"
title = "Real-fluid gas film of the Peng-Robinson surface: Chung dense-fluid transport, Riazi-Whitson diffusivity, Peng-Robinson density and c_p (Spray A, SA2, D313)"
switch = "[spray.evaporation.peng_robinson] film = \"real-fluid\" (default), critical_volume"
decisions = ["D313"]
model = true
evidence = [
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/dense_film.rs::chung_follows_the_nist_nitrogen_tables", what = "Chung et al. (1988) with the NIST density against the NIST nitrogen tables (Span et al. 2000, Lemmon and Jacobsen 2004), 300 to 1200 K, 0.1 to 15 MPa: viscosity within 1.5 % (found 1.3 %), conductivity within 7 % (6.8 %); the dense-fluid factors the film takes within 1.5 % and 5 % of the NIST ratios to 0.1 MPa (1.3 %, 4.8 %)" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/dense_film.rs::the_factors_vanish_at_low_density_and_riazi_whitson_slows_dense_diffusion", what = "the viscosity and conductivity factors are 1 at 1 Pa (1e-6), the Riazi-Whitson factor 1 at low pressure (1e-15) and falling with pressure at 2, 6 and 15 MPa" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/dense_film.rs::the_peng_robinson_heat_capacity_and_density_of_nitrogen", what = "Peng-Robinson c_p (ideal gas plus departure) of nitrogen within 1 % (found 0.8 %) and the density within 2.5 % (2.2 % at 300 K, 15 MPa) of NIST" },
  { kind = "reference-data", test = "crates/foehncraft-particles/tests/dense_film.rs::chung_overestimates_the_liquid_like_dodecane", what = "the recorded gap: n-dodecane at 6 MPa and 500 to 700 K (liquid-like density), the factors 9 to 17 % (viscosity) and 40 to 55 % (conductivity) above the NIST ratios (Lemmon and Huber 2004; Huber, Laesecke, Perkins 2004)" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/dense_film.rs::at_low_pressure_the_real_fluid_film_is_the_ideal_film", what = "at 0.1 MPa the real-fluid film equals the ideal-gas film of D321 within 1 % in all six properties" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/dense_film.rs::the_film_of_a_spray_a_droplet", what = "Spray A film (900 K N2, 6 MPa, droplets at 450 to 600 K with the Peng-Robinson surface fraction): density 0.97 to 0.99, viscosity 1.005 to 1.04, conductivity 1.01 to 1.05, c_p 1.01 to 1.03, diffusivity 1.0 to 1.03 times the ideal film (own results); the vapour c_p bitwise the ideal gas's" },
  { kind = "consistency", test = "crates/foehncraft-particles/tests/high_pressure.rs::the_table_reaches_its_end_from_any_cold_start", what = "the surface table from a cold start (150 to 250 K) at 4, 6 and 8 MPa reaches the same critical end above 600 K (1e-6 K); it ended near 260 K before (Newton stalled at round-off)" },
]
gaps = [
  "the Chung coefficient tables (E1 to E10, B1 to B7) and the water association factor kappa = 0.076 are transcribed from secondary sources and checked against NIST nitrogen only, not yet against the printed paper (Chung et al. 1988; Poling, Prausnitz, O'Connell 2001, tables 9-6 and 10-3)",
  "Riazi and Whitson (1993) read from a secondary account; used without their constant 1.07 so that the factor is 1 at low pressure (Takahashi 1975 not built: its correlation is a chart)",
  "for a liquid-like dense fuel the factors are 9 to 17 % (viscosity) and 40 to 55 % (conductivity) too high; the Spray A film is mostly nitrogen gas, where the method holds",
  "the film gases are the `ambient` key, not the local gas of the cell; the gas solver stays an ideal gas (D317)",
  "at Spray A conditions (6 MPa) the effect is small (film 1 to 7 %, droplet life -3 %): no measurement isolates it",
]

[[feature]]
id = "sprays.ecn-diagnostics"
area = "Sprays"
title = "ECN liquid length (projected liquid volume) and vapour penetration (Spray A, SA3, D315)"
switch = "[spray.ecn]"
decisions = ["D315"]
model = false
evidence = [
  { kind = "exact", test = "crates/foehncraft-particles/tests/ecn.rs::the_liquid_length_of_a_linear_plv_profile_is_exact", what = "parcels with a linearly falling liquid volume: the PLV of every bin to 1e-12 and both liquid lengths (0.95 and 0.5 of the line) to 1e-12 m" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/ecn.rs::the_volume_along_the_line_of_sight_is_summed_and_across_it_is_not", what = "two parcels along the line of sight add in one bin, two across it fall in two; the threshold is reached at the summed bin" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/ecn.rs::the_default_line_of_sight_is_across_the_axis", what = "the default and a given line of sight are unit vectors across the axis (to 1e-15)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/ecn.rs::the_vapour_penetration_is_the_farthest_cell_at_the_threshold", what = "the vapour penetration is the farthest axial distance of a cell at or above 0.1 % on a slanted axis (to 1e-15), behind the nozzle and off threshold ignored" },
  { kind = "contract", property = "bitwise", test = "crates/foehncraft-particles/tests/ecn.rs::the_liquid_length_does_not_depend_on_the_parcel_order", what = "the parcels in reverse order give the same bits; without [spray.ecn] no length is written" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-particles/tests/ecn.rs::the_ecn_table_is_checked", what = "negative thresholds, a line of sight along an injector, a vapour fraction outside (0, 1) and the steady spray mode are refused with the key named" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/spray_evaporation.rs::the_ecn_diagnostics_are_written_per_step", what = "the evaporating duct writes both liquid lengths and the vapour penetration per step; the smaller threshold lies farther out, within the farthest parcel, and the vapour inside the duct" },
  { kind = "consistency", case = "spray_chamber_ecn", what = "water sprayed into still air at 300 C: the liquid lengths settle while the vapour penetration keeps growing", doc = "docs/gallery/sprays.md#spray-ecn" },
  { kind = "contract", property = "schema", case = "spray_chamber_ecn_injectors", what = "the included injector file of spray_chamber_ecn", doc = "docs/cases/flow.md#lagrangian-sprays" },
]
gaps = [
  "the PLV definition of the modelling standard only: the ECN5 path-averaged liquid volume fraction (0.15 % on 0.5 x 0.5 mm paths) and the time- and Favre-averaged fields on the ECN output grid are not built",
  "instantaneous values per step: an average over the quasi-steady period is the user's (the CSV has every step)",
  "no Spray A comparison yet (VA.8, stage SA6)",
]

[[feature]]
id = "porous.darcy-forchheimer"
area = "Flow models"
title = "Porous regions with a direction-dependent Darcy-Forchheimer resistance (D270, PM1)"
