  { kind = "consistency", test = "crates/foehncraft-mesh/tests/industry_msh.rs::face_orientation_does_not_matter", what = "face orientation does not change the mesh" },
]
gaps = ["no flow case of the catalogue reads an industry .msh file"]

[[feature]]
id = "mesh.vtk"
area = "Meshes"
title = "VTK reader (.vtk, .vtu) and VTU writer"
switch = 'mesh.format = "vtk"'
evidence = [
