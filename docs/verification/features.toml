[[feature]]
id = "buoyancy.variable-density"
area = "Buoyancy"
title = "Low-Mach variable density ρ(T, p₀)"
switch = "[energy] density = \"variable\", [buoyancy] model = \"variable-density\""
decisions = ["D151"]
model = true
evidence = [
  { kind = "exact", case = "vd_heated_duct", what = "gas heated by 100 K in a slip-wall duct: equal mass flows to 10⁻¹², the outlet ΔT of ṁ c_p ΔT = Q to 10⁻⁴, the inlet pressure G²(1/ρ_out − 1/ρ_in) to 2·10⁻³", doc = "docs/cases/flow.md#variable-density" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/variable_density.rs::heated_duct_meets_the_one_dimensional_balances", what = "the three balances of the duct and the heat ledger to 10⁻⁸" },
  { kind = "manufactured", case = "vd_mms_steady", what = "ρ = 1/T, a divergence-free mass flux, the full stress, a closed volume: observed orders 2.22 and 1.92 (velocity), 1.86 and 1.90 (temperature)", doc = "docs/cases/flow.md#variable-density" },
  { kind = "manufactured", test = "crates/foehncraft-flow/tests/variable_density.rs::manufactured_solution_converges_at_second_order", what = "second order on hexahedra and polygons; SIMPLEC and the coupled algorithm on the same discrete solution" },
  { kind = "consistency", case = "vd_cavity_large_dt", what = "air in a cavity with walls at 960 K and 240 K: heat flow order 2.13, GCI 0.020 %; p₀ order 2.2, GCI 0.003 %", doc = "docs/gallery/energy.md#variable-density" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/variable_density.rs::variable_density_settings_are_checked", what = "the settings without a low-Mach meaning or not built yet are refused with their codes" },
