evidence = [
  { kind = "exact", test = "crates/foehncraft-kernels/src/evaporation.rs::saturation_pressure_of_water_at_its_anchor_points", what = "the IAPWS-95 auxiliary vapour-pressure equation (Wagner and Pruss 1993) at the triple point and at 373.124 K / 101.325 kPa" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/evaporation.rs::the_temperature_relaxes_to_the_wet_bulb_state_without_overshoot", what = "the droplet temperature of the frozen-coefficient step relaxes to the wet-bulb balance and never passes it" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/evaporation.rs::saturated_gas_neither_evaporates_nor_condenses_at_the_droplet_temperature", what = "a droplet at the saturation state of the gas keeps its mass" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/evaporation.rs::a_single_droplet_follows_the_d2_law_at_the_wet_bulb", what = "a 100 um water droplet at 300 K in still dry air at 500 K: d^2 falls linearly (local K within 1 %), at the wet-bulb temperature within 0.05 K, life within 20 % of d0^2/K plus the heat-up (Godsave 1953, Spalding 1953)" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/evaporation.rs::a_closed_box_ends_at_the_adiabatic_saturation", what = "V28.2 with evaporation: 1e-7 kg of water in a closed cell of air at 400 K, 3000 steps: water and energy of gas plus parcels kept to 1e-12; gas at the exact adiabatic saturation within 0.01 K (found 0.003 K), liquid mean within 0.1 K, vapour within 1e-3 of saturation" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/evaporation.rs::many_parcels_in_one_cell_near_saturation", what = "4000 parcels evaporating in one cell at 95 % saturation (D247 to D250): the vapour never passes the droplet saturation and never falls below zero, the water book closes to 1e-13, sources and parcels bitwise equal on 1 and 4 threads with the storage reversed" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/spray_evaporation.rs::the_evaporating_duct_closes_its_books", what = "a transient evaporating duct: ledger pairs 2801 to 2805 zero to the bit, parcel mass, momentum and enthalpy accounts close to 1e-12, the gas mass account to 1e-9, vapour to the gas = liquid lost by the parcels" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/spray_evaporation.rs::evaporation_gives_the_same_bits_on_any_number_of_threads", what = "V28.1 with evaporation in a flow run: spray.csv bitwise equal on 1 and 4 threads" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-flow/tests/spray_evaporation.rs::evaporation_needs_a_vapour_species_of_the_case", what = "a liquid whose vapour is not a species of the case is refused" },
  { kind = "contract", property = "diagnostics", case = "spray_evaporation", what = "2 g/s of water droplets of 10 to 80 um in air at 300 C: about 1.3 g/s evaporate within the duct, the air leaves about 55 K cooler and 2 % wetter; ledger pairs zero to the bit", doc = "docs/gallery/sprays.md#spray-evaporation" },
  { kind = "contract", property = "schema", case = "spray_evaporation_injectors", what = "the included injector file of spray_evaporation, with the vapour species", doc = "docs/cases/flow.md#lagrangian-sprays" },
  { kind = "consistency", case = "spray_saturation_steady", what = "V28.11 (partly met, see gaps): 2 g/s of water in 17.6 g/s of air at 400 K, steady mode: the air saturates within 5 cm and stays flat to the outlet; outlet 309.3 K and Y = 0.0375 against the exact adiabatic saturation 310.1 K and 0.0395; the source residual falls from 1 to 0.12", doc = "docs/gallery/sprays.md#spray-saturation" },
  { kind = "contract", property = "schema", case = "spray_saturation_injectors", what = "the six nozzles of spray_saturation_steady", doc = "docs/cases/flow.md#lagrangian-sprays" },
]
