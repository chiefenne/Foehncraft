[[feature]]
id = "cht.frozen-flow"
area = "Conjugate heat transfer"
title = "Frozen-flow march of a transient conjugate run"
switch = "[energy.frozen_flow]"
decisions = ["D118"]
evidence = [
  { kind = "consistency", case = "cht_heated_wall_frozen", what = "V7.43: the switched-on heated wall with a viscosity that halves over 17 K: held at 55 s, 7 refreshes, 557 steps against 6000 fully coupled; every probe within 0.058 K of the fully coupled history over a 21 K rise, balance closed to 3·10⁻¹²", doc = "docs/gallery/energy.md#cht-frozen-flow" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/cht_frozen.rs::frozen_flow_follows_the_fully_coupled_heat_up", what = "V7.43: a flow that does not depend on T is held once, never refreshed; within 0.1 K of the fully coupled history and 0.01 K at the end; balance below 10⁻⁹; LIM010" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/cht_frozen.rs::viscosity_that_follows_the_temperature_refreshes_the_flow", what = "V7.43: μ(T): at least 3 refreshes for temperature, within 0.15 K of the fully coupled history, balance below 10⁻⁹" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/cht_frozen.rs::frozen_flow_restart_continues_bit_identically", what = "a restart in a frozen phase and in the coupled steps of a refresh continues bitwise (the march state and μ(T) in restart.h5)" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/cht_frozen.rs::wrong_frozen_settings_are_refused", what = "settings that cannot be used are refused (FRZ001)" },
]
gaps = ["laminar cases only; no turbulent or buoyant case yet (buoyancy counts as a flow that follows T, untested)", "the settling test looks at the velocity only (not the turbulence quantities)", "a flow with time-dependent boundary values is held between refreshes (FRZ004), no automatic refresh by the change of the boundary values", "no adaptive march step"]

[[feature]]
id = "cht.several-fluids"
area = "Conjugate heat transfer"
title = "Several fluids and materials in one case (fluid parts)"
switch = "[regions.<name>] kind = \"fluid\" with material, temperature"
decisions = ["D194"]
evidence = [
  { kind = "reference-data", case = "cht_counterflow_two_fluids", what = "V7.33 (planar form): water / light-oil counterflow across a steel plate, C_r = 1: effectiveness 0.7756 against ε–NTU 0.7751 with the fully developed Nu = 5.385 (band 2 %); heat of water, plate and oil agree, ledger to 3·10⁻⁵", doc = "docs/gallery/energy.md#two-fluids" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/fluids.rs::counterflow_of_water_and_oil_follows_eps_ntu", what = "ε within 2 % of ε–NTU, the oil warms as much as the water cools (C_r = 1), water, plate and oil heat flows agree to 10⁻³" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/fluids.rs::two_fluids_touching_are_refused", what = "REG004 for two fluids sharing a face" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/fluids.rs::a_part_without_pressure_level_is_refused", what = "REG003 for a fluid part without a pressure boundary" },
]
gaps = ["V7.33 in its planar form only (no double pipe, no thin-wall run: thin walls between fluids come with MF-D)", "V7.34 (closed parts with their own reference and p₀) and V7.35 (tube-and-fin cell) not built yet (MF-B, MF-D)", "variable density, gravity, rotating zones and passive scalars refused with several fluids (REG006)", "one turbulence model for all fluids (models per region: MF-C)", "the shell and tube exchanger (application 203) is a demonstration: one mesh, the water-side heat flows swing by a few percent (C3), constant fluid properties, no comparison with a tube-bank correlation"]

