  { kind = "exact", test = "crates/foehncraft-kernels/src/particle.rs::heat_step_relaxes_exactly_and_halves_compose", what = "the parcel temperature relaxes exactly, T_p = T_g + (T_p0 - T_g) exp(-dt/tau_h), with tau_h = rho_p c_p d^2 / (6 Nu k) and Nu of Ranz and Marshall; two half steps give one full step" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/spray_coupling.rs::a_cloud_and_its_gas_reach_one_temperature_at_any_step", what = "V28.2, V28.3 for heat: a cloud of water at 300 K in one cell of air at 400 K, loading 0.1 and 1, steps of 0.03 to 23 thermal response times: gas and parcels end at the mixture temperature to 1e-9, the mixture keeps its enthalpy to 1e-9, the parcel enthalpy books close to 1e-12, the ledger pair to the bit, the gas never gains heat" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/spray_coupling.rs::the_heat_coupling_converges_at_first_order_in_the_step", what = "V28.4 for heat: the gas temperature of the same cell with halved steps against a fourth-order reference of the two-temperature relaxation: observed order 1.03 and 1.04 (above 0.9 required)" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/spray_coupling.rs::passes_give_the_same_bits_on_any_number_of_threads", what = "V28.1 with heat: spray.csv bitwise equal on 1 and 4 threads, for the momentum case and the heat case" },
  { kind = "exact", test = "crates/foehncraft-particles/tests/coupling.rs::sources_do_not_depend_on_parcel_order_or_threads", what = "V28.1: the heat sources and the heat closing step bitwise equal with the parcel storage reversed and on one thread; the heat slopes of a parcel at most m c_p; the enthalpy books close to round-off" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/balance.rs::a_closed_box_with_a_spray_closes_every_step_and_the_run", what = "accounts of the same quantity and region booked by two modules are one account (the spray heat on the thermal account of the energy equation)" },
  { kind = "contract", property = "diagnostics", case = "spray_cooling", what = "10 g/s of water at 20 °C sprayed into air at 300 °C in a duct: about 6.6 kW taken from the air, the mean air temperature falls by about 50 K; gas heat and coupling numbers in spray.csv", doc = "docs/gallery/sprays.md#spray-cooling" },
  { kind = "contract", property = "schema", case = "spray_cooling_injectors", what = "the included injector file of spray_cooling with the liquid temperature", doc = "docs/cases/flow.md#lagrangian-sprays" },
]
