  { kind = "consistency", test = "crates/foehncraft-flow/src/chemistry/tests.rs::the_reactor_ends_at_the_equilibrium_and_conserves_the_elements", what = "the GRI-Mech 3.0 reactor from 1400 K ends at its own equilibrium: |T_end - T_eq| below 0.5 K (4e-5 K in the gallery case), mole fractions within 2e-4, element drift below 1e-9; Jones-Lindstedt within 1 K" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/chemistry/tests.rs::reversible_reactions_stop_at_the_gibbs_equilibrium", what = "at the Gibbs equilibrium of 1500 and 2200 K every reversible GRI-Mech reaction has a net rate below 1e-6 of its forward rate (detailed balance of the rates and the equilibrium code)" },
  { kind = "exact", test = "crates/foehncraft-flow/src/chemistry/tests.rs::the_analytic_jacobian_matches_finite_differences", what = "the analytic Jacobian of species and temperature (third-body, Lindemann, Troe and non-integer-order terms) matches finite differences to 1e-4 scaled, measured 6e-12 to 2e-7, for GRI-Mech 3.0 at 900 and 1600 K and both global mechanisms" },
  { kind = "exact", test = "crates/foehncraft-kernels/src/chemistry.rs::rodas3_has_order_three_and_controls_its_error", what = "RODAS3 on a linear stiff problem: third order with fixed steps, the adaptive error within the tolerance" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/chemistry/mechanism.rs::the_built_in_mechanisms_load", what = "GRI-Mech 3.0 reads as 53 species and 325 reactions (26 Troe, 3 Lindemann); the rate constants of Jones-Lindstedt in SI equal the cm-mol-s values of the literature table (Si et al. 2020)" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-flow/src/chemistry/mechanism.rs::unbalanced_and_unsupported_reactions_are_refused", what = "CHM001 for an unbalanced reaction and for a pressure-dependent (PLOG) rate, which is not implemented" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/chemistry/tests.rs::reactor_inputs_are_checked", what = "a composition without oxidiser, an unknown fuel species and a negative temperature are refused" },
]
