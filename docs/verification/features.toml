[[feature]]
id = "mesh.vtkhdf-input"
area = "Meshes"
title = "VTKHDF reader (whole, partitioned and blocked files)"
switch = 'mesh.format = "vtkhdf"'
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::blocked_file_reads_as_its_vtu", what = "a blocked file (polyhedra, ghost layer, global point ids, original cell numbers) reads as the mesh of the .vtu of the same cells, bit for bit, for any block size and cell order" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::koflcraft_files_read_as_their_vtu", what = "KoflCraft's own blocked files (box4, channel) read as the mesh of the .vtu of the same export, bit for bit" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::koflcraft_channel_matches_its_evidence", what = "the channel reproduces its mesh-evidence.json: counts, total volume, patch faces and areas, zones" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::blocked_file_without_point_ids_joins_by_coordinates", what = "partitions without GlobalPointIds joined by coordinates, same mesh" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::own_output_reads_back_as_its_mesh", what = "FoehnCraft's own fields.vtkhdf reads back with the same cells, volumes, zones and boundaries" },
  { kind = "contract", property = "diagnostics", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::broken_counts_are_refused", what = "counts beyond the file and point ids beyond the points refused with a message" },
]
gaps = ["the KoflCraft fixtures in the repository hold one block each; the two-block sweep (99,160 cells) is checked by hand", "no flow case of the catalogue reads a VTKHDF file"]

[[feature]]
id = "mesh.partition"
area = "Meshes"
title = "Partitioning with METIS and halos"
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/decompose.rs::decompositions_are_consistent", what = "decompositions consistent, halos complete" },
]
gaps = ["multi-node runs are designed for, not run (no cluster yet)"]

[[feature]]
id = "mesh.quality-remediation"
area = "Meshes"
title = "Quality report and automatic remediation of skewed cells"
switch = 'solver.remediation = "auto"'
decisions = ["D50"]
evidence = [
  { kind = "exact", test = "crates/foehncraft-flow/tests/quality.rs::the_bounded_face_velocity_is_exact_for_a_linear_field_and_bounded_on_skewed_faces", what = "bounded face velocity exact for a linear field" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/quality.rs::the_gauss_weights_give_the_exact_gradient_of_a_linear_field_without_skewness", what = "Gauss gradient exact for a linear field" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/quality.rs::raw_gmsh_tetrahedra_converge_with_the_remediation", what = "raw Gmsh tetrahedra converge with it and fail without it" },
]
gaps = ["no order of accuracy on remediated meshes (the remediation is first order on the skewed faces by design)"]

[[feature]]
id = "mesh.operator-check"
area = "Meshes"
title = "Operator exactness check of the velocity gradient and Hessian"
switch = "solver.operator_tolerance"
decisions = ["D236"]
evidence = [
  { kind = "exact", test = "crates/foehncraft-fv/src/exactness.rs::linear_fields_are_exact_on_every_mesh", what = "the least-squares gradient of linear fields exact to 10⁻¹⁰ on regular and perturbed hexahedra and tetrahedra" },
  { kind = "exact", test = "crates/foehncraft-fv/src/exactness.rs::regular_hexahedra_are_second_order_inside", what = "gradient and Hessian of quadratic fields exact inside regular hexahedra, flagged at the walls" },
  { kind = "consistency", test = "crates/foehncraft-fv/src/exactness.rs::irregular_cells_are_flagged", what = "perturbed hexahedra and tetrahedra flagged" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/operators.rs::regular_hexahedra_flag_only_the_boundary_cells", what = "MESH005 and MESH006 with the features on; only the wall cells of a regular mesh" },
  { kind = "consistency", case = "cavity_sst_operator_check", what = "the cavity on perturbed tetrahedra: every cell takes both quadratic fits, no MESH005 or MESH006 left, operators.csv written, the run converges" },
]
gaps = ["cells where a quadratic fit fails are only flagged (MESH005, MESH006); the local remesh of such cells is deferred to v1.1 with D54 (D236 step 4)"]

[[feature]]
id = "mesh.vtkhdf"
area = "Meshes"
title = "VTKHDF output for ParaView"
switch = "output.vtkhdf"
evidence = [
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf.rs::write_all_types", what = "every cell type written; CI checks the files of the cases" },
  { kind = "consistency", test = "crates/foehncraft-mesh/src/vtkhdf.rs::standard_cells_in_vtk_order", what = "tetrahedra, hexahedra, prisms and pyramids in VTK's node order: VTK's outward faces (VTK 9.7 GetFace tables) are the cell's outward faces, positive volume, also for cells given inside out" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::blocked_output_keeps_the_layout", what = "blocked layout 1: runs of owned cells, exactly their point neighbours as ghosts, point owners, block bounds and ranges, owner cells; a renumbering keeps the blocks" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf_read.rs::blocked_output_of_any_block_size_reads_alike", what = "the same mesh and volumes from one cell per block to one block" },
  { kind = "consistency", test = "crates/foehncraft-mesh/tests/vtkhdf.rs::size_estimate_matches_the_file", what = "the size estimate of the run plan against the written file, two blocks" },
  { kind = "consistency", test = "python/tests/test_vtkhdf.py::test_blocks_come_back_in_one_piece", what = "scripts get the blocks back as one grid in the order of the identities" },
]
gaps = ["the parallel writer (all ranks into one file) is still serial", "ParaView reads the blocks through VTK 9.7.2 here; the maintainer's ParaView is not checked"]

# ---------------------------------------------------------------- numerics

[[feature]]
id = "numerics.gradient-ls"
area = "Numerics"
title = "Weighted least-squares gradients"
switch = 'solver.pressure_gradient = "least-squares"'
evidence = [
  { kind = "exact", test = "crates/foehncraft-fv/tests/stage2.rs::gradient_of_a_linear_field_is_exact_on_every_mesh_type", what = "exact for a linear field on every cell type" },
  { kind = "manufactured", case = "mms_poly_box", what = "second order of convection-diffusion on polyhedra", doc = "docs/verification/stage2.md#order-of-accuracy" },
  { kind = "manufactured", case = "mms_tet_box", what = "second order on tetrahedra" },
  { kind = "manufactured", case = "mms_hex_box", what = "second order on hexahedra" },
  { kind = "manufactured", case = "mms_poly_2d", what = "second order on 2D polygons" },
]

[[feature]]
id = "numerics.convection-schemes"
area = "Numerics"
title = "Linear upwind and bounded central convection"
switch = "solver.momentum.scheme"
evidence = [
  { kind = "manufactured", test = "crates/foehncraft-fv/tests/stage2.rs::order_of_accuracy_on_all_mesh_types", what = "second order on every cell type" },
  { kind = "exact", case = "poiseuille_hex", what = "second order of the flow solver" },
]

[[feature]]
id = "numerics.limiters"
area = "Numerics"
title = "Venkatakrishnan(-Wang) limiters"
switch = "solver.momentum.limiter"
evidence = [
  { kind = "exact", case = "oblique_step_2d", what = "a discontinuity at 30° stays within its bounds with every limiter", doc = "docs/verification/stage2.md#limiters-on-the-oblique-step" },
  { kind = "consistency", test = "crates/foehncraft-fv/tests/stage2.rs::limited_face_values_create_no_new_extrema", what = "limited face values create no new extrema" },
]
gaps = ["no observed order with a limiter switched on in a smooth flow"]

[[feature]]
id = "numerics.mlp-limiter"
area = "Numerics"
title = "Vertex-based MLP limiter of the scalars and the energy equation"
switch = "solver.scalar.limiter, solver.energy.limiter = \"mlp\""
decisions = ["D237"]
evidence = [
  { kind = "exact", case = "scalar_oblique_step_mlp", what = "a step at 31° on 30 % perturbed polyhedra stays within [0, 1.0021] with R3 and c = 0.01 (Venkatakrishnan: [−0.0175, 1.0178])", doc = "docs/gallery/scalars.md#mlp-limiter" },
  { kind = "exact", test = "crates/foehncraft-flow/tests/scalars.rs::mlp_limiter_bounds_the_oblique_step", what = "within ε of the bounds with c = 0.01, within 10⁻⁹ with c = 0, the face limiter outside" },
  { kind = "consistency", test = "crates/foehncraft-kernels/src/fv.rs::nishikawa_functions_are_bounded_and_smooth", what = "R3, R4 and R5 bounded at ε = 0 and smooth" },
  { kind = "consistency", test = "crates/foehncraft-flow/src/limiter.rs::a_strip_of_two_hexahedra_shares_four_vertices", what = "the vertex stencil of a small mesh" },
  { kind = "consistency", case = "tjunction_mixing", what = "θ of the T-junction within [−0.0019, 1.0015], the scalar difference converges at order 2.1 over three meshes", doc = "docs/gallery/flow.md#tjunction-mixing" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/scalars.rs::mlp_limiter_restart_continues_bit_identically", what = "ψ of the relaxation in restart.h5 (`scalar_psi_<name>`): a steady run continued from the middle ends bit-identically" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/cht_cycle.rs::steady_cht_restart_with_the_mlp_energy_limiter_is_bit_identical", what = "the energy's ψ in restart.h5 (`cht_psi`): a steady conjugate run continued from the middle ends bit-identically" },
]
gaps = [
  "not the default: Venkatakrishnan stays the limiter of the scalars and the energy equation until a full validation run",
  "ε = 0 and the per-cell ε can stall a steady run (the T-junction from the medium mesh on)",
  "on a smooth manufactured solution on polyhedra the error with R3 is 2.5 times the unlimited one (second order kept)",
  "bounds the reconstruction, not a stalled steady iteration: the water of the heat exchanger (application 203) falls to 15.7 °C in a few end-chamber cells, below its 20 °C inlet",
  "not run on a GPU",
]

[[feature]]
id = "numerics.reproducible"
area = "Numerics"
title = "Reproducible (gather-based) assembly"
decisions = ["D93"]
evidence = [
  { kind = "consistency", test = "crates/foehncraft-fv/tests/stage2.rs::results_are_bitwise_reproducible", what = "bitwise equal results" },
  { kind = "consistency", test = "crates/foehncraft-flow/tests/stage4.rs::results_are_bitwise_equal_on_1_and_4_threads", what = "flow results bitwise equal on 1 and 4 threads" },
  { kind = "consistency", test = "crates/foehncraft-parallel/src/repro.rs::independent_of_thread_count", what = "reductions independent of the thread count" },
]
notes = ["a consistency property by nature: partial is its highest grade under the rules, which ask for an exact solution"]

