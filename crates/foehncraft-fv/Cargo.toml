[package]
name = "foehncraft-fv"
description = "Foehncraft finite-volume operators on a scalar: least-squares gradients, limiters, convection and diffusion, sliced-ELL assembly, BiCGStab, and the pressure solver (CG with smoothed-aggregation AMG, mixed precision), on the CPU and the NVIDIA GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# the build script passes the hypre library directory to dependents
# (DEP_FOEHNCRAFT_HYPRE_LIBDIR) for their rpath
links = "foehncraft_hypre"

[features]
default = ["hdf5"]
# VTKHDF output of the fields (HDF5 built from source).
hdf5 = ["foehncraft-mesh/hdf5"]
# METIS available for the mesh case (not needed by the operators).
metis = ["foehncraft-mesh/metis"]
# hypre (BoomerAMG with PCG) as the reference solver of `foehn poisson`
# (D20): needs HYPRE_DIR, the install prefix of a sequential hypre build.
hypre = ["dep:cc"]
# MPI examples (system MPI library and libclang at build time).
mpi = ["foehncraft-parallel/mpi", "foehncraft-mesh/mpi"]

[dependencies]
foehncraft-core.workspace = true
foehncraft-kernels.workspace = true
foehncraft-mesh.workspace = true
foehncraft-parallel.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
schemars.workspace = true

[build-dependencies]
cc = { version = "1", optional = true }

[[example]]
name = "mpi_scalar"
required-features = ["mpi"]

[lints]
workspace = true
