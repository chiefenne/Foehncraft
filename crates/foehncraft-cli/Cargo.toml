[package]
name = "foehncraft-cli"
description = "Foehncraft command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "foehn"
path = "src/main.rs"

[features]
default = ["hdf5", "metis"]
# VTKHDF output (HDF5 built from source; needs CMake and a C compiler).
hdf5 = ["foehncraft-flow/hdf5", "foehncraft-tools/hdf5"]
# METIS partitioning (built from source).
metis = ["foehncraft-tools/metis"]
# NVIDIA GPU backends (crate foehncraft-cuda, D60); no CUDA toolkit needed
# to build, the driver is loaded at run time.
cuda = ["foehncraft-cuda/cuda"]
# hypre as the reference solver of `foehn poisson` (needs HYPRE_DIR).
hypre = ["foehncraft-tools/hypre", "foehncraft-fv/hypre"]
mpi = ["foehncraft-tools/mpi"]
checked-indexing = ["foehncraft-tools/checked-indexing"]

[dependencies]
# Every engine function through the tool registry (D196); `cargo xtask
# layering` checks that the sources call nothing else of the engine.
foehncraft-tools.workspace = true
# Types of the engine: diagnostics, build information, interrupts, roots.
foehncraft-flow.workspace = true
# Registers the GPU backends.
foehncraft-cuda.workspace = true
# Only for the hypre library directory its build script reports (the
# rpath of `foehn`, build.rs); no calls.
foehncraft-fv.workspace = true
clap.workspace = true
anyhow = "1"
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[lints]
workspace = true
