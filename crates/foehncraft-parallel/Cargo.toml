[package]
name = "foehncraft-parallel"
description = "Foehncraft parallel layer: communicator abstraction (serial and MPI) and reproducible threaded reductions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# MPI backend through the system MPI library (D9). Needs an MPI installation
# and libclang at build time.
mpi = ["dep:mpi"]

[dependencies]
foehncraft-core.workspace = true
rayon.workspace = true
mpi = { workspace = true, optional = true }

[[example]]
name = "mpi_smoke"
required-features = ["mpi"]

[[example]]
name = "mpi_latency"
required-features = ["mpi"]

[lints]
workspace = true
