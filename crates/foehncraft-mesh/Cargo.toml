[package]
name = "foehncraft-mesh"
description = "Foehncraft mesh: polyhedral face-based mesh, geometry and quality, built-in test mesher, Gmsh, SU2, Fluent .msh, CGNS, VTK and OpenFOAM readers, partitioning and halo layout, point location and VTKHDF output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hdf5", "metis"]
# VTKHDF output through the HDF5 C library (D41, D9), built from its
# bundled source (needs CMake and a C compiler, no HDF5 installation).
hdf5 = ["dep:hdf5-metno"]
# Graph partitioning with METIS 5, built from source (D32).
metis = ["dep:metis"]
# MPI halo exchange example (system MPI library).
mpi = ["foehncraft-parallel/mpi"]

[dependencies]
foehncraft-core.workspace = true
foehncraft-kernels.workspace = true
foehncraft-parallel.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
anyhow = "1"
schemars.workspace = true
hdf5-metno = { workspace = true, optional = true }
metis = { workspace = true, optional = true }

[[example]]
name = "mpi_halo"
required-features = ["mpi"]

[[example]]
name = "mpi_matrix"
required-features = ["mpi"]

[lints]
workspace = true
