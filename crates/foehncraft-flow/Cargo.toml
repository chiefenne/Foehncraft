[package]
name = "foehncraft-flow"
description = "Foehncraft incompressible flow solver: SIMPLEC with Rhie–Chow interpolation on polyhedral meshes, boundary conditions with a combination check, the flow case file, log and CSV output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hdf5"]
# VTKHDF output of the fields (HDF5 built from source).
hdf5 = ["foehncraft-fv/hdf5", "foehncraft-mesh/hdf5", "foehncraft-particles/hdf5", "dep:hdf5-metno"]
# MPI examples (system MPI library and libclang at build time).
mpi = ["foehncraft-parallel/mpi", "foehncraft-mesh/mpi", "foehncraft-fv/mpi"]

[dependencies]
foehncraft-core.workspace = true
foehncraft-kernels.workspace = true
foehncraft-mesh.workspace = true
foehncraft-fv.workspace = true
foehncraft-particles.workspace = true
foehncraft-parallel.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
schemars.workspace = true
sha2.workspace = true
hdf5-metno = { workspace = true, optional = true }

[dev-dependencies]
# the case reader of gate G1 in the broken-input corpus (D202)
foehncraft-bench.workspace = true

[[example]]
name = "mpi_flow"
required-features = ["mpi"]

[lints]
workspace = true
