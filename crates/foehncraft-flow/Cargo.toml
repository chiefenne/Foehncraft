[package]
name = "foehncraft-flow"
description = "Foehncraft incompressible flow solver: SIMPLEC with Rhie–Chow interpolation on polyhedral meshes, boundary conditions with a combination check, the flow case file, log and CSV output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The integration tests are one program (tests/main.rs): see its header.
autotests = false

[features]
default = ["hdf5", "blake3"]
# BLAKE3 hashes of the output files in result.json (D84). Its build
# script compiles C and assembly for speed, so the C-free build without
# default features (D87) hashes with SHA-256 instead, named `sha256`.
blake3 = ["dep:blake3"]
# VTKHDF output of the fields (HDF5 built from source).
hdf5 = ["foehncraft-fv/hdf5", "foehncraft-mesh/hdf5", "foehncraft-particles/hdf5", "dep:hdf5-metno"]
# MPI examples (system MPI library and libclang at build time).
mpi = ["foehncraft-parallel/mpi", "foehncraft-mesh/mpi", "foehncraft-fv/mpi"]

[dependencies]
foehncraft-core.workspace = true
foehncraft-kernels.workspace = true
foehncraft-mesh.workspace = true
foehncraft-fv.workspace = true
foehncraft-particles.workspace = true
foehncraft-circuits.workspace = true
foehncraft-parallel.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow = "1"
schemars.workspace = true
sha2.workspace = true
yaml-rust2.workspace = true
blake3 = { workspace = true, optional = true }
hdf5-metno = { workspace = true, optional = true }

[dev-dependencies]
# the case reader of gate G1 in the broken-input corpus (D202)
foehncraft-bench.workspace = true

[[test]]
name = "flow"
path = "tests/main.rs"

# the second half of the integration tests (see tests/main.rs)
[[test]]
name = "flow2"
path = "tests/main2.rs"

[[example]]
name = "mpi_flow"
required-features = ["mpi"]

[lints]
workspace = true
