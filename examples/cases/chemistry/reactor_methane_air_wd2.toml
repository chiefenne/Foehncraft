# Constant-pressure adiabatic reactor of stoichiometric methane and air
# (SF2): ignition from 1400 K at 1 atm and the approach to the chemical
# equilibrium, with the mechanism westbrook-dryer-2.
#
#   foehn chemistry reactor examples/cases/chemistry/reactor_methane_air_wd2.toml
#
# Writes the trace to output/reactor_methane_air_wd2/reactor.csv:
# time, temperature and the mole fractions of every species.

[reactor]
mechanism = "westbrook-dryer-2"
pressure = 101325.0
temperature = 1400.0
end_time = 0.1
equivalence_ratio = 1.0
fuel = { CH4 = 1.0 }
oxidiser = { O2 = 0.21, N2 = 0.79 }
samples = 600
spacing = "log"            # output times evenly in log t from 1e-7 s

[reactor.check]
# The reverse CO step of Westbrook & Dryer (eq. 11) is an Arrhenius rate of
# its own, not the equilibrium constant: the reactor ends about 280 K above
# the equilibrium of its species, a known flaw of the mechanism (not of the
# integrator), so only the elements are checked here.
equilibrium_temperature = [2880.0, 2895.0]
element_drift = 1e-10
