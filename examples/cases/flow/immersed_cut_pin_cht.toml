# A heated pin in a channel, cut out of a box mesh and kept as a solid
# region: conjugate heat transfer through cut cells (L13 stage 2d, D229).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/immersed_cut_pin_cht.toml
#
# The channel and flow of the Schäfer & Turek 2D-1 benchmark (gallery 313:
# H = 0.41 m, a pin of D = 0.1 m off the centre line, parabolic inflow with
# 0.3 m/s at the centre, Re = 20) on the same plain box mesh of 440 × 82
# hexahedra (h = D/20). The pin is an aluminium heater (k = 200 W/(m K),
# 2·10⁵ W/m³, 15.7 W in the 0.01 m deep slice); the fluid has
# ρ = 1 kg/m³, c_p = 1000 J/(kg K), k = 1 W/(m K) (Pr = 1) and enters at
# 300 K; the channel walls are adiabatic. `[regions.pin]` names the body
# as its zone, so the cut keeps the inside of the pin as cells of the solid
# region and the wall faces between fluid and pin become the region
# interface: the flow sees a no-slip wall `interface-pin`, the energy
# equation one matrix over fluid and pin with the series conductance on
# the interface faces.
#
# The power leaves with the flow: the heat balance of the report closes
# to round-off (sources = outflow).
#
# Result: see gallery entry "cut-cht".

case_format = "0.7"

[mesh.generate]
type = "hex"
dimension = 2
upper = [2.2, 0.41, 0.01]
cells = [440, 82, 1]

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 1e-3
specific_heat = 1000.0
conductivity = 1.0
pressure_values = "gauge"

[materials.aluminium]
kind = "solid"
density = 2700.0
specific_heat = 900.0
conductivity = 200.0

[flow]
convection = true

[immersed]
method = "cut"

[immersed.cut]
min_volume_fraction = 0.3

[[immersed.body]]
name = "pin"
shape = "cylinder"
centre = [0.2, 0.2, 0.0]
radius = 0.05

[regions.pin]
kind = "solid"
zones = ["pin"]
material = "aluminium"

[energy]
initial = 300.0

[[energy.sources]]
region = "pin"
power_density = 2.0e5

[boundary.xmin]
type = "velocity-inlet"
profile = "parabolic"
max_velocity = 0.3
profile_axes = ["y"]
[boundary.xmin.energy]
temperature = 300.0
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
max_iterations = 3000
tolerance = 1e-8
log_every = 200

[solver.energy]
relaxation = 1.0
tolerance = 1e-10
max_iter = 300

[verification]
require_convergence = true

[output]
wall_csv = true
