# Natural convection between a hot and a cold vertical wall: the buoyant
# slot, a check of the Boussinesq buoyancy against its exact solution
# (stage 7b1, D153).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/buoyancy_slot.toml
#
# Two vertical walls 1 m apart, the left one at 301 K, the right one at
# 300 K, periodic in the vertical direction (an infinitely tall slot).
# The temperature is linear between the walls; with the Boussinesq force
# about the mean temperature the fluid rises at the hot wall and falls at
# the cold one with no net flow:
#
#   v = (g β ΔT D² / (48 ν)) (ξ³ − ξ),   ξ = 2 x / D − 1,
#
# here g β ΔT = 0.01 m/s², ν = 0.01 m²/s, so the largest speed is
# 8.0e-3 m/s. Three perturbed meshes (8 × 2 to 32 × 8 cells, 15 %): the
# observed order of the velocity error is 2.14 and 2.13.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 0.25, 0.05]
cells = [8, 2, 1]
perturb = 0.15

[fluid]
density = 1.0
viscosity = 0.01
specific_heat = 1000.0
conductivity = 1.0
temperature = 300.5        # T_ref of the buoyancy, the mean temperature

[energy]
initial = 300.5

[gravity]
vector = [0.0, -1.0, 0.0]

[buoyancy]
model = "boussinesq"
expansion_coefficient = 0.01

[analytic]
type = "buoyant-slot"
lower = 0.0
upper = 1.0
buoyancy = 0.01            # g β ΔT (m/s²)

[boundary.xmin]
type = "wall"
[boundary.xmin.energy]
temperature = 301.0
[boundary.xmax]
type = "wall"
[boundary.xmax.energy]
temperature = 300.0
[boundary.ymin]
type = "periodic"
partner = "ymax"
[boundary.ymax]
type = "periodic"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-10
max_iterations = 2500

[solver.energy]
tolerance = 1e-12
max_iter = 200

[verification]
levels = [0, 1, 2]
expected_order = [1.8, 2.3]

[output]
wall_csv = false
