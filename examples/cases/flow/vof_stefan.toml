# The Stefan problem of evaporation (volume of fluid with phase change, L3
# stage MP2): a vapour layer between a heated wall and saturated water
# grows by the heat it conducts to the interface. Exact solution (Stefan
# 1891; the set-up of Welch & Wilson 2000, J. Comput. Phys. 160, 662-682):
#
#   δ(t) = 2 λ √(α_v t),   λ exp(λ²) erf(λ) = St/√π,   St = c_p,v ΔT/h_lv,
#
# with the temperature T = T_w − ΔT erf(x/(2√(α_v t)))/erf(λ) in the vapour
# and T_sat in the liquid. Water at 1 atm (IAPWS-IF97, `foehn steam
# --pressure 101325`), ΔT = T_w − T_sat = 10 K: St = 0.009206, λ = 0.067742,
# α_v = 1.9789e-5 m²/s.
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/vof_stefan.toml
#
# The run starts at t₀ = 0.027530 s with the exact fields (δ = 0.1 mm), not a
# uniform field, and ends at t = 0.6883 s (δ = 0.5 mm exact). The vapour
# stays at rest; the liquid leaves through the outlet at u = (1 − ρ_v/ρ_l)
# dδ/dt. `vof.csv` gives the vapour volume (δ = L − volume/A) per step;
# tools/plot/vof_phase_change.py compares it with δ(t).

case_format = "0.7"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0e-3, 2.0e-5, 2.0e-5]
cells = [200, 1, 1]

[fluid]
density = 0.597623116
viscosity = 1.22312654e-5
specific_heat = 2077.39017
conductivity = 2.45677073e-2

[energy]
# the exact profile at t₀: erf(x/(2√(α_v t₀)))/erf(λ), δ₀ = 1e-4 m
initial = "if(x < 1.0e-4, 383.1243 - 10.0 * erf(x / (2.0 * sqrt(1.978878679e-5 * 0.027529922861853306))) / erf(0.06774198562683174), 373.1243)"

[vof]
scheme = "thinc"

[[vof.phase]]
name = "water"
density = 958.372729
viscosity = 2.81660968e-4
specific_heat = 4216.61269
conductivity = 0.677207143

[[vof.phase]]
name = "vapour"
density = 0.597623116
viscosity = 1.22312654e-5
specific_heat = 2077.39017
conductivity = 2.45677073e-2

[vof.phase_change]
liquid = "water"
saturation_temperature = 373.1243
latent_heat = 2.25654075e6

[[vof.region]]
shape = "box"
lower = [1.0e-4, -1.0, -1.0]
upper = [1.0, 1.0, 1.0]

[boundary.xmin]
type = "wall"
[boundary.xmin.energy]
temperature = 383.1243
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 101325.0
[boundary.ymin]
type = "symmetry"
[boundary.ymax]
type = "symmetry"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[vof.inflow]
xmax = 1.0

[solver]
algorithm = "piso"
# outer iterations per step: the volume source of the phase change and the
# density jump need them (one PISO pass drives a checkerboard)
outer_iterations = 10
outer_tolerance = 1.0e-6
log_every = 100

[solver.energy]
tolerance = 1e-12
max_iter = 300

[time]
scheme = "bdf1"
start_time = 0.027529922861853306
time_step = 1.0e-3
steps = 661

[output]
fields_every = 100

[verification]
require_convergence = false
