# A pulsating laminar channel flow over a thick heated wall, coupled
# cycle-averaged (D204, §9d of the stage 7 specification, V7.39): the
# inlet velocity is 1 ± 0.5 m/s and the inlet temperature 300 ± 50 K, both
# over a period of 50 s; 1000 W/m² go into the wall from below.
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/cht_pulsating_channel_cycle.toml
#
# The loop alternates fluid phases (two periods with the wall temperatures
# held, the second averaged) and steady solves of the wall with the
# cycle-mean Robin pair (Ḡ, T̄_ref) of every interface face. It stops when
# the wall temperatures change by less than 0.01 K and the interface heat
# flow by less than 0.1 % between two updates. The fully coupled transient
# run (the same case without [energy.cycle]) needs about 3000 s, sixty
# periods, to reach its periodic state, with the wall's time constant of
# about 300 s.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [4.0, 0.4, 0.04]
cells = [80, 20, 1]
split = [
  { boundary = "xmin", axis = "y", at = 0.2, name = "inlet" },
  { boundary = "xmax", axis = "y", at = 0.2, name = "outlet" },
]
zones = [{ name = "wall", lower = [0.0, 0.0, 0.0], upper = [4.0, 0.2, 0.04] }]

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.01                     # Re = U H/ν = 20 with the channel height H = 0.2 m
specific_heat = 1000.0
conductivity = 14.084507042253522    # Pr = μ c_p/k = 0.71

[materials.wall-solid]
kind = "solid"
description = "a made-up solid with k_s/k_f = 10 (not a database material)"
density = 100.0                      # light: a time constant of about 300 s
specific_heat = 800.0
conductivity = 140.84507042253522

[regions.wall]
kind = "solid"
zones = ["wall"]
material = "wall-solid"

[energy]
initial = 300.0                      # everything at the inlet temperature at t = 0

[energy.cycle]
period = 50.0                        # s, 20 time steps
warmup_cycles = 1                    # after every update, not averaged
average_cycles = 1
tolerance = 0.01                     # K, the largest change of a wall temperature per update
heat_tolerance = 0.001               # the relative change of the interface heat flow
max_updates = 6

[initial]
velocity = [0.0, 0.0, 0.0]

[boundary.inlet]
type = "velocity-inlet"
velocity = ["1.0 + 0.5*sin(2.0*pi*t/50.0)", 0.0, 0.0]   # m/s, pulsating
[boundary.inlet.energy]
temperature = "300.0 + 50.0*sin(2.0*pi*t/50.0)"   # K, a period of 50 s
[boundary.outlet]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "wall"
[boundary.ymin]
type = "wall"
[boundary.ymin.energy]
heat_flux = 1000.0                   # W/m² into the wall
[boundary.xmin]
type = "wall"                        # the upstream end of the wall
[boundary.xmax]
type = "wall"                        # the downstream end of the wall
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[time]
scheme = "bdf2"
time_step = 2.5
end_time = 3000.0                     # an upper bound: the loop stops by itself

[solver]
outer_iterations = 3                 # the flow takes Courant numbers of 100

[solver.momentum]
relaxation = 0.9

[solver.energy]
relaxation = 1.0
tolerance = 1e-10
max_iter = 300

[output]
wall_csv = false
fields_every = 400
probes = [
  { name = "heated_face", point = [3.0, 0.005, 0.02] },
  { name = "wall_upstream", point = [0.5, 0.195, 0.02] },
  { name = "wall_middle", point = [2.0, 0.195, 0.02] },
  { name = "wall_downstream", point = [3.5, 0.195, 0.02] },
  { name = "channel", point = [3.0, 0.3, 0.02] },
]
lines = [
  { name = "wall_top", from = [0.025, 0.18, 0.02], to = [3.975, 0.18, 0.02], points = 80 },
  { name = "across", from = [3.0, 0.0, 0.02], to = [3.0, 0.4, 0.02], points = 81 },
]
