# Charging a honeycomb heat store: hot air from the top through a stack of
# ceramic honeycomb bricks, gas and matrix with temperatures of their own
# (D271, porous plan PM2; gallery entry of the two temperatures).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/porous_storage_charge.toml
#
# A section of a store 0.4 m wide and 1 m high: a plenum at the top, a
# stack of bricks 0.7 m high (channels of 6.9 mm on a pitch of 13.6 mm,
# ε = 0.256, vertical), a plenum at the bottom. Air at 573 K enters at
# 0.4 m/s through an opening in the top right corner and leaves through an
# opening in the bottom left; the bricks and the air start at 293 K. The
# `honeycomb` gives the resistance of the channels (Shah & London 1978),
# the exchange h = Nu k / d_h with Nu = 2.98 and a = 4 ε / d_h, and the
# conduction of the brick walls, (1 − ε) k_s along the channels and
# (1 − √ε) k_s across (D272).
#
# The matrix stores heat, so a thermocline moves down the stack about
# 7 000 times slower than the air in the channels: after 6 000 s it is
# half way. The air
# leaving the hot part of the stack is at the matrix temperature within a
# few kelvin; at the front the two differ.
#
# The swirl in the upper plenum does not converge within the 10 outer
# iterations of a step (Courant number 2 400); the flow in the stack is
# uniform within 1 % and not affected.
#
# Simplifications of this stage: constant gas properties (air at about
# 420 K; a density that follows T with porous regions comes later), no
# radiation in the channels (R1b), the matrix exchanges heat with the gas
# only (adiabatic at the stack faces).

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [0.4, 1.0, 0.01]
cells = [40, 100, 1]
split = [
  { boundary = "ymax", axis = "x", at = 0.3, name = "inlet" },
  { boundary = "ymin", axis = "x", at = 0.1, name = "floor" },
]
zones = [
  { name = "stack", lower = [0.0, 0.15, 0.0], upper = [0.4, 0.85, 0.01] },
]

[materials.ceramic]
kind = "solid"
description = "a fired ceramic of honeycomb bricks (chosen values: textbook range of cordierite-like ceramics)"
density = 2300.0
specific_heat = 900.0
conductivity = 2.0

[fluid]
density = 0.85
viscosity = 2.4e-5
specific_heat = 1020.0
conductivity = 0.035

[regions.stack]
kind = "porous"
zones = ["stack"]
axes = [[0.0, 1.0, 0.0], [1.0, 0.0, 0.0]]
[regions.stack.porous]
honeycomb = { channel = 6.9e-3, pitch = 13.6e-3, length = 0.15 }
solid = "ceramic"
source = "square channels of laminar duct flow, Shah & London 1978"

[energy]
initial = 293.0

[boundary.inlet]
type = "velocity-inlet"
velocity = [0.0, -0.4, 0.0]
[boundary.inlet.energy]
temperature = 573.0
[boundary.ymin]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "wall"
[boundary.ymax.energy]
heat_flux = 0.0
[boundary.floor]
type = "wall"
[boundary.floor.energy]
heat_flux = 0.0
[boundary.xmin]
type = "wall"
[boundary.xmin.energy]
heat_flux = 0.0
[boundary.xmax]
type = "wall"
[boundary.xmax.energy]
heat_flux = 0.0
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[time]
scheme = "bdf2"
time_step = 30.0
end_time = 6000.0

[solver]
outer_iterations = 10
outer_tolerance = 1e-8

[verification]
require_convergence = false

[output]
wall_csv = false
fields_times = [1500.0, 3000.0]
lines = [{ name = "axis", from = [0.2, 0.0, 0.005], to = [0.2, 1.0, 0.005], points = 201 }]
