# Subcooled boiling of water in a heated vertical tube against the measured
# void of Bartolomei et al. (1982), case B-11 of Zou, Zhao & Zhang (INL
# 2018, OSTI 1480427): p = 14.74 MPa, G = 1847 kg/(m² s), q = 0.77 MW/m²,
# T_in = 598 K (L3, stage MP4, D357 to D359).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/boiling_pipe_bartolomei_b11.toml --out output/boiling_pipe/b11
#   python3 examples/studies/boiling_pipe/compare.py output/boiling_pipe
#
# Same tube, mesh, models and closures as boiling_pipe_bartolomei_b7.toml
# (its header explains the choices). Liquid: IAPWS-IF97 density, viscosity
# and conductivity at T_sat − 10 K and the mean specific heat between T_in
# and saturation; vapour: saturated steam at 14.74 MPa (T_sat 613.91 K).
case_format = "0.7"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.5, 0.006, 0.001]
cells = [300, 12, 1]
wedge = 2.0

[fluid]
density = 646.12
viscosity = 7.5260e-05

[gravity]
vector = [-9.81, 0.0, 0.0]

[turbulence]
model = "k-omega-sst"

[initial]
velocity = [2.8586, 0.0, 0.0]
turbulence_intensity = 0.05
viscosity_ratio = 100.0

[two_fluid]
[two_fluid.gas]
name = "steam"
density = 94.105
viscosity = 2.2559e-05
diameter = 1.0e-3

[two_fluid.boiling]
pressure = 1.4740e+07
liquid_specific_heat = 7217.5
liquid_conductivity = 0.505
[two_fluid.boiling.inflow_temperature]
xmin = 598.0
[two_fluid.boiling.heat_flux]
ymax = 7.700e+05

[boundary.xmin]
type = "velocity-inlet"
velocity = [2.8586, 0.0, 0.0]
turbulence_intensity = 0.05
viscosity_ratio = 100.0
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 1.4740e+07
[boundary.ymax]
type = "wall"
[boundary.zmin]
type = "wedge"
[boundary.zmax]
type = "wedge"

[solver]
algorithm = "piso"
outer_iterations = 10
outer_tolerance = 1.0e-5
log_every = 100

[time]
scheme = "bdf1"
time_step = 1.0e-3
steps = 2000

[output]
fields_every = 500

[verification]
require_convergence = false
