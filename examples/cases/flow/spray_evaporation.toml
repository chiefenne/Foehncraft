# Water droplets evaporating in hot air (Lagrangian sprays, SP4 and SP5):
# the droplets give the air vapour, mass and the enthalpy they carry, the
# air gives the droplets the heat that evaporates them.
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/spray_evaporation.toml
#
# Air at 300 °C with a little water vapour (Y_H2O = 0.005) flows at 5 m/s
# through a duct of 1 m by 0.2 m (2D, SST k-ω). A nozzle 0.1 m behind the
# inlet sprays 2 g/s of water at 20 °C as droplets of 10 to 80 µm. Each
# droplet heats up towards its wet-bulb temperature and evaporates with the
# film model of Ranz and Marshall ([spray.evaporation]); the vapour goes into
# the species H2O, the mass into the continuity equation and the enthalpy
# into the energy equation, as value-plus-slope sources with a closing step
# (D250). The passes of each step repeat until the coupling lag is below the
# tolerance.
#
# Constant density and `properties = "fluid"`: the heat balance then closes
# to round-off; with the mixture properties of the species the energy
# account keeps a gap of a few parts in a thousand (the T-form of the
# energy equation against the material enthalpy of the balance).

case_format = "0.7"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 0.2, 0.1]
cells = [100, 20, 1]

[fluid]
density = 0.6
viscosity = 2.9e-5
specific_heat = 1045.0
conductivity = 0.045
operating_pressure = 101325.0
pressure_values = "gauge"

[turbulence]
model = "k-omega-sst"
wall_treatment = "automatic"

[initial]
velocity = [5.0, 0.0, 0.0]
turbulence_intensity = 0.05
viscosity_ratio = 10.0

[energy]
initial = 573.15

[species]
names = ["H2O", "O2", "N2"]
initial = { mass_fractions = { H2O = 0.005, O2 = 0.2318, N2 = 0.7632 } }
diffusion = "schmidt"
schmidt = 0.7
properties = "fluid"

[boundary.xmin]
type = "velocity-inlet"
velocity = [5.0, 0.0, 0.0]
[boundary.xmin.energy]
temperature = 573.15
[boundary.xmin.species]
mass_fractions = { H2O = 0.005, O2 = 0.2318, N2 = 0.7632 }
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymin]
type = "wall"
[boundary.ymin.energy]
heat_flux = 0.0
[boundary.ymax]
type = "wall"
[boundary.ymax.energy]
heat_flux = 0.0
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[time]
scheme = "bdf2"
time_step = 0.002
end_time = 0.4

[spray]
include = "spray_evaporation_injectors.toml"
wall_mode = "stick"
write_every = 50

[spray.evaporation]
model = "ranz-marshall"

[spray.coupling]
mode = "two-way"
passes = "converged"
tolerance = 1e-3
max_passes = 4

[solver]
tolerance = 1e-6
max_iterations = 300

[solver.scalar]
limiter = "mlp"

[verification]
require_convergence = false
