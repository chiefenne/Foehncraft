# A steady channel flow solved on ranks (MPI step W7): every rank solves
# its part, rank 0 writes the log, the run record and every output file,
# and the monitors, probes, ledger, field and restart files are computed
# on the fields gathered into the order of the whole mesh, so every output
# file is byte for byte that of one rank (D93, D84).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/ranks_run_channel.toml
#
# runs it on the five ranks of `[run] rank_count` (threads of this process;
# `--ranks N` overrides the count). With a build that has the `mpi` feature
# the ranks may be MPI processes instead:
#
#   cargo build --release -p foehncraft-cli --features mpi
#   mpirun -n 5 target/release/foehn flow examples/cases/flow/ranks_run_channel.toml
#
# The channel of ranks_channel_poly.toml: perturbed polyhedra, the upper
# wall moves against the inflow (Re = 100 on the height), a probe in the
# recirculation, the ledger every 25 iterations.

case_format = "0.7"

[mesh.generate]
type = "poly"
dimension = 2
upper = [3.0, 1.0, 0.1]
cells = [90, 30, 1]
perturb = 0.1

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.01

[initial]
potential_flow = true

[boundary.xmin]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
[boundary.xmax]
type = "static-pressure-outlet"
pressure = 101325.0
[boundary.ymin]
type = "wall"
[boundary.ymax]
type = "wall"
velocity = [-1.0, 0.0, 0.0]
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
tolerance = 1e-7
max_iterations = 600
log_every = 25

[solver.momentum]
limiter = "venkatakrishnan"

[balance]
every = 25

[[output.probes]]
name = "eddy"
point = [2.5, 0.8, 0.05]

[log]
columns = [
  "residual.momentum",
  "residual.continuity",
  "probe.eddy.velocity_x",
  "max.velocity_magnitude",
  "boundary.xmax.mass_flow",
]

[run]
rank_count = 5
