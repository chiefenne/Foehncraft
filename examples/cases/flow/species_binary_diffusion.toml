# Diffusion of methane in nitrogen at rest: the exact decay of a cosine
# mode of the mass fraction (stage SF1).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/species_binary_diffusion.toml
#
# A closed slab 0 < x < 1 m, walls at both ends (zero flux) and slip walls
# and symmetry planes on the sides, holds CH4 and N2 at rest with the
# mass fraction Y_CH4 = 0.5 + 0.4 cos(π x). The mixture is isothermal with
# the fluid's density ρ = 1 kg/m³ and viscosity μ = 1e-3 Pa s
# (`properties = "fluid"`), and Sc = 1 gives D = μ/(ρ Sc) = 1e-3 m²/s.
# Exact: Y_CH4 = 0.5 + 0.4 cos(π x) exp(−D π² t), and the closure species
# N2 = 1 − Y_CH4 in every cell. BDF2 with Δt = 0.5 s to t = 50 s on 100
# cells: the L2 error against the exact field is below 1e-4.

case_format = "0.7"

[mesh.generate]
type = "hex"
dimension = 2
upper = [1.0, 0.1, 0.01]
cells = [100, 2, 1]

[fluid]
density = 1.0
viscosity = 1.0e-3
pressure_values = "gauge"

[species]
names = ["CH4", "N2"]
initial = { mass_fractions = { CH4 = "0.5 + 0.4*cos(pi*x)" } }
properties = "fluid"
schmidt = 1.0
exact = { CH4 = "0.5 + 0.4*cos(pi*x)*exp(-1.0e-3*pi*pi*t)" }

[boundary.xmin]
type = "wall"
[boundary.xmax]
type = "wall"
[boundary.ymin]
type = "slip-wall"
[boundary.ymax]
type = "slip-wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[time]
scheme = "bdf2"
time_step = 0.5
steps = 100

[solver]
tolerance = 1e-9

[solver.scalar]
tolerance = 1e-12
max_iter = 200

[output]
wall_csv = false
