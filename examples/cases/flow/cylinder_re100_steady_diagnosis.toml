# Iteration budget and diagnosis of a steady run (D198 (d)): the cylinder
# of Schäfer & Turek at Re = 100 (benchmark 2D-2) run STEADY on purpose.
# The flow sheds vortices at this Reynolds number, so a steady solution
# that satisfies the equations to the tolerance does not exist and the
# residual cannot fall to it. Instead of letting such a run go on for
# 10 000 iterations, it is diagnosed at iteration 2000: the trend of each
# residual over the last 500 iterations, the verdict and advice go into the
# run record (`run.jsonl`, row type "diagnosis") and the log, and with
# `diagnosis = "stop"` the run stops there (restart file and results
# written, exit code 3, RUN017).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/cylinder_re100_steady_diagnosis.toml
#
# `foehn flow --check` shows the iteration budget, its source and the
# iteration of the diagnosis next to the D81 estimate. The transient run of
# the same flow is cylinder_re100.toml. Gallery and recipe 164.

case_format = "0.6"

[mesh.cylinder]
refine = 1

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 1e-3

[flow]
convection = true

[boundary.inlet]
type = "velocity-inlet"
profile = "parabolic"
max_velocity = 1.5               # mean 1.0: Re = 100 on D = 0.1
profile_axes = ["y"]
[boundary.outlet]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.walls]
type = "wall"
[boundary.cylinder]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[solver]
max_iterations = 3000            # the iteration budget
tolerance = 1e-8
log_every = 250

[run.limits]
diagnose_at = 2000               # the default; written out to be visible
diagnosis = "stop"               # stop a run that is off track there

[verification]
require_convergence = false

[output]
wall_csv = false
