[energy]
initial = "scriven(sqrt(x * x + y * y + z * z))"

[vof]
scheme = "thinc"
# no surface tension: the exact solution has none (the Laplace pressure of
# R = 0.1 mm would only shift T_sat by 0.02 K)
surface_tension = 0.0

[[vof.phase]]
name = "water"
density = 958.372729
viscosity = 2.81660968e-4
specific_heat = 4216.61269
conductivity = 0.677207143

[[vof.phase]]
name = "vapour"
density = 0.597623116
viscosity = 1.22312654e-5
specific_heat = 2077.39017
conductivity = 2.45677073e-2

[vof.phase_change]
liquid = "water"
saturation_temperature = 373.1243
latent_heat = 2.25654075e6

# water everywhere, then the bubble
[[vof.region]]
shape = "box"
lower = [-1.0, -1.0, -1.0]
upper = [1.0, 1.0, 1.0]

[[vof.region]]
shape = "sphere"
centre = [0.0, 0.0, 0.0]
radius = 1.0e-4
alpha = 0.0

[boundary.centre]
type = "wall"
[boundary.outer]
type = "static-pressure-outlet"
pressure = 101325.0
[boundary.side]
type = "symmetry"

[vof.inflow]
outer = 1.0

[solver]
algorithm = "piso"
outer_iterations = 10
outer_tolerance = 1.0e-6
log_every = 100

[solver.energy]
tolerance = 1e-12
max_iter = 300

[time]
scheme = "bdf1"
start_time = 0.0009019513782345319
time_step = 5.0e-6
steps = 1447

[output]
fields_every = 250

[verification]
require_convergence = false
