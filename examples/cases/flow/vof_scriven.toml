# Scriven's bubble (volume of fluid with phase change, L3 stage MP2): a
# vapour bubble grows in a uniformly superheated liquid, fed by the heat of
# the thermal layer around it. Exact solution (Scriven 1959, Chem. Eng. Sci.
# 10, 1-13):
#
#   R(t) = 2 β √(α_l t),
#   ρ_l c_p,l ΔT/(ρ_v h_lv) = 2 β² ∫₀¹ exp(−β² ((1 − ξ)⁻² − 2 ε ξ − 1)) dξ,
#   T(r) = T∞ − 2 β² ρ_v h_lv/(ρ_l c_p,l) ∫ from 1 − R/r to 1 of the same,
#
# ε = 1 − ρ_v/ρ_l (the sensible heat difference (c_p,l − c_p,v) ΔT of the
# original is left out, as the model does). Water at 1 atm (IAPWS-IF97,
# `foehn steam --pressure 101325`), ΔT = T∞ − T_sat = 1.25 K: β = 4.06693.
#
#   python3 examples/meshes/sphere_sector.py examples/meshes/sphere_sector.su2 --r0 2e-6 --r1 5e-4 --cells 500   (committed)
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/vof_scriven.toml
#
# The mesh is a thin sector of the sphere (half angle 2°, 1 μm cells): its
# side planes pass through the centre, so `symmetry` there is exact for the
# radial flow. The run starts at t₀ = 0.902 ms with the exact fields (R =
# 0.1 mm; T from the table, not a uniform field) and ends at t = 8.1 ms (R
# = 0.3 mm exact). The bubble volume is the vapour volume of vof.csv over the
# solid angle of the sector; tools/plot/vof_phase_change.py compares R(t).

case_format = "0.7"

[mesh]
file = "../../meshes/sphere_sector.su2"

[fluid]
density = 0.597623116
viscosity = 1.22312654e-5
specific_heat = 2077.39017
conductivity = 2.45677073e-2

