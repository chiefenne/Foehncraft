# A sliding rotor in conformal stepping solved on ranks (MPI step W7,
# turning zones): the gap between a cylinder turning at 10 rad/s and a
# fixed outer cylinder, the inner half of the gap a rotor of 128 identical
# sectors that turns by one sector per time step (D182), spun up from rest
# with a blob of dye in the rotor, on five ranks. The rotor cells land on
# cells of other ranks: the old levels of their time terms (velocity, dye)
# are gathered from all ranks into the order of the whole mesh and each
# rank takes the values of its own cells, so every rank solves bitwise the
# cells of the one-rank run, and rank 0 writes every output file byte for
# byte as one rank does (D93, D84).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/ranks_run_sliding_couette.toml
#
# runs it on the five ranks of `[run] rank_count` (threads of this process;
# `--ranks N` overrides the count, `--ranks 1` gives the reference). With a
# build that has the `mpi` feature the ranks may be MPI processes:
#
#   cargo build --release -p foehncraft-cli --features mpi
#   mpirun -n 5 target/release/foehn flow examples/cases/flow/ranks_run_sliding_couette.toml
#
# Re = w r1 (r2 - r1) / nu = 50; one turn of the rotor (128 steps of
# 2 pi / 1280 s), 4 096 cells. The dye blob starts at r = 0.06 m in the rotor and is
# drawn out into a spiral by the shear of the gap.

case_format = "0.7"

[mesh.annulus]
r_inner = 0.05
r_outer = 0.10
depth = 0.01
n_theta = 32
n_r = 8
rotor_layers = 4
refine = 2

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 5e-4

[constants]
spin = 10.0

[flow]
convection = true

[time]
scheme = "bdf2"
time_step = 0.004908738521234052
steps = 128
start_time = 0.0

[[sliding]]
zone = "rotor"
axis = [0.0, 0.0, 1.0]
omega = 10.0

[boundary.inner]
type = "wall"
velocity = ["-spin * y", "spin * x", 0.0]
[boundary.outer]
type = "wall"
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[scalars.dye]
diffusivity = 2e-5
initial = "if((x - 0.06)^2 + y^2 < 0.012^2, 1.0, 0.0)"

[solver]
tolerance = 1e-10
max_iterations = 3000

[[output.probes]]
name = "gap"
point = [0.0, 0.07, 0.005]

[log]
columns = ["probe.gap.velocity_y", "rotor.rotor.angle", "rotor.rotor.torque"]

[output]
fields_every = 64

[run]
rank_count = 5
