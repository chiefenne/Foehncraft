# The water side of the convective evaporator pass (SF7c,
# `flow/circuit_evaporator_pass.toml`): a drum loop at 7 MPa with two
# banks of risers, one behind each wall of the gas pass. Per metre of wall
# depth 12 tubes of 40 mm bore (pitch 83 mm) rise 6 m from the lower to
# the upper header; a downcomer of 150 mm takes the drum water down 8 m,
# a relief pipe returns the wet steam; the feedwater comes from an
# economizer at 550 K. The gas pass gives the risers their heat, face by
# face; the `heat_flux` below is only the start of the coupling (the
# first circuit solve, before the walls have a heat of their own). Each
# bank takes the flow its heat drives.
#
# Start flows near the solution keep the Newton solve on the branch of
# upward flow in the risers: at small heat (here below about 15 kW/m²) a
# loop like this one also has a steady state with the flow reversed, the
# risers flowing down and wet steam rising in the downcomer.

[circuit]
name = "evaporator_pass_drum"
segments = 30

[[nodes]]
name = "drum"
kind = "drum"
pressure = 7.0e6
feed_temperature = 550.0
elevation = 8.0

[[nodes]]
name = "lower_header"
kind = "junction"
elevation = 0.0

[[nodes]]
name = "upper_header"
kind = "junction"
elevation = 6.0

[[tubes]]
name = "downcomer"
from = "drum"
to = "lower_header"
length = 9.0
rise = -8.0
diameter = 0.15
loss = 1.5
start_flow = 27.0

[[tubes]]
name = "risers_left"
from = "lower_header"
to = "upper_header"
count = 12
length = 6.0
rise = 6.0
diameter = 0.04
heat_flux = 3.0e4
start_flow = 1.1

[[tubes]]
name = "risers_right"
from = "lower_header"
to = "upper_header"
count = 12
length = 6.0
rise = 6.0
diameter = 0.04
heat_flux = 3.0e4
start_flow = 1.1

[[tubes]]
name = "relief"
from = "upper_header"
to = "drum"
length = 3.0
rise = 2.0
diameter = 0.2
loss = 1.0
start_flow = 27.0
