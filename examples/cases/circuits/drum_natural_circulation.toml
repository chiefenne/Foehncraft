# A natural circulation loop of a drum boiler at 7 MPa (SF7b): a downcomer
# of 22 m takes the drum water to the lower header, 30 furnace wall
# risers heated by 150 kW/m2 lift the wet steam back into the drum. The
# flow follows from the balance of gravity and losses around the loop;
# the drum separates the steam and mixes the feedwater at 490 K into the
# water of the downcomer.

[circuit]
name = "drum_natural_circulation"
segments = 60

[[nodes]]
name = "drum"
kind = "drum"
pressure = 7.0e6
feed_temperature = 490.0
elevation = 22.0

[[nodes]]
name = "lower_header"
kind = "junction"
elevation = 0.0

[[nodes]]
name = "upper_header"
kind = "junction"
elevation = 20.0

[[tubes]]
name = "downcomer"
from = "drum"
to = "lower_header"
length = 24.0
rise = -22.0
diameter = 0.25
loss = 1.5
start_flow = 40.0

[[tubes]]
name = "risers"
from = "lower_header"
to = "upper_header"
count = 30
length = 20.0
rise = 20.0
diameter = 0.05
heat_flux = 1.5e5
unheated_inlet = 1.0
start_flow = 1.3

[[tubes]]
name = "relief"
from = "upper_header"
to = "drum"
length = 4.0
rise = 2.0
diameter = 0.3
loss = 1.0
start_flow = 40.0
