# Canonical local meshes (MPI plan step W1, D93 (1), (3)): a perturbed 2D
# polyhedral mesh split into 3 ranks with METIS, two halo layers. Every rank
# stores some faces flipped against the global mesh (its own cell must be
# the owner of a processor face, and inner faces run from the lower to the
# higher local cell); geometry evaluates them in the global node order, and
# every cell sums its faces in global face order, so the geometry of every
# rank is bitwise that of the one-rank mesh. The report lists the flipped
# faces per rank and the faces and cells that differ (always 0; the run
# fails otherwise); the output carries the cell fields `rank` and
# `flipped_faces`. Gallery example and recipe of the same number.
#
#   foehn mesh examples/cases/mesh/canonical_ranks.toml

case_format = "0.6"

[mesh.generate]
type = "poly"
dimension = 2
lower = [0.0, 0.0, 0.0]
upper = [2.0, 1.0, 0.1]
cells = [24, 12, 1]
perturb = 0.25
seed = 2026

[partition]
parts = 3
method = "metis"       # metis | rcb
halo_layers = 2
