[workspace]
resolver = "3"
members = [
    "crates/foehncraft-core",
    "crates/foehncraft-kernels",
    "crates/foehncraft-parallel",
    "crates/foehncraft-mesh",
    "crates/foehncraft-fv",
    "crates/foehncraft-particles",
    "crates/foehncraft-flow",
    "crates/foehncraft-bench",
    "crates/foehncraft-cuda",
    "crates/foehncraft-tools",
    "crates/foehncraft-cli",
    "xtask",
]
# Built separately with the nightly toolchain for the NVIDIA PTX target
# (see gpu/ptx-kernels/README.md).
# The Python bindings need a Python interpreter to build (python/,
# built with maturin); the solver crates build and test without one.
exclude = ["gpu/ptx-kernels", "crates/foehncraft-py"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/chiefenne/Foehncraft"
authors = ["Andreas Ennemoser"]

[workspace.dependencies]
foehncraft-core = { path = "crates/foehncraft-core", version = "1.0.0" }
foehncraft-kernels = { path = "crates/foehncraft-kernels", version = "1.0.0" }
foehncraft-parallel = { path = "crates/foehncraft-parallel", version = "1.0.0" }
foehncraft-mesh = { path = "crates/foehncraft-mesh", version = "1.0.0", default-features = false }
foehncraft-fv = { path = "crates/foehncraft-fv", version = "1.0.0", default-features = false }
foehncraft-particles = { path = "crates/foehncraft-particles", version = "1.0.0", default-features = false }
foehncraft-flow = { path = "crates/foehncraft-flow", version = "1.0.0", default-features = false }
foehncraft-bench = { path = "crates/foehncraft-bench", version = "1.0.0" }
foehncraft-cuda = { path = "crates/foehncraft-cuda", version = "1.0.0" }
foehncraft-tools = { path = "crates/foehncraft-tools", version = "1.0.0", default-features = false }
rayon = "1.12"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
toml = "1.2"
toml_edit = "0.25"
mpi = "0.8"
hdf5-metno = { version = "0.15", features = ["static"] }
metis = "0.2"
cudarc = { version = "0.19", default-features = false }
schemars = "1.2"
sha2 = "0.11"
signal-hook = "0.4"

[workspace.lints.rust]
# D202: `unsafe` only in the named GPU and SIMD modules, which allow it with
# `#![allow(unsafe_code)]`; tools/check/unsafe_modules.py holds the list.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# D202: every unsafe block and unsafe impl carries a `// SAFETY:` comment
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

# Profile for the fast PR gate: same optimisation level as `release`, but
# no LTO and 16 codegen units, so the workspace crates compile about twice
# as fast. Results are bitwise equal to `release` (Rust never contracts or
# reassociates f64 arithmetic, whatever the codegen units). main, nightly
# and releases keep using `release`.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
debug = false
