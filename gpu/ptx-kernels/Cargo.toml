[package]
name = "foehncraft-ptx-kernels"
description = "G1 single-source route: the foehncraft-kernels bodies as NVIDIA PTX entry points"
version = "1.3.0"
edition = "2024"
license = "MIT"
publish = false

# Not a member of the main workspace: built with the nightly toolchain for
# the nvptx64-nvidia-cuda target by build.py.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
foehncraft-kernels = { path = "../../crates/foehncraft-kernels" }
foehncraft-core = { path = "../../crates/foehncraft-core" }

[features]
checked-indexing = ["foehncraft-kernels/checked-indexing"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
